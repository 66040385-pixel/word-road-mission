<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Microsoft Word Arcade Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --yellow: #facc15;
      --green: #10b981;
      --bg: #0f172a;
    }
    * {
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.4) 0%, rgba(15, 23, 42, 0.96) 85%), #0f172a;
      font-family: 'Kanit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      color: #fff;
    }

    .hub-container {
      max-width: 760px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid #38bdf8;
      border-radius: 36px;
      padding: 34px 24px 28px;
      color: #0f172a;
      box-shadow: 0 25px 60px rgba(2, 132, 199, 0.35), 0 0 0 8px rgba(255, 255, 255, 0.25);
      text-align: center;
    }

    .header-box {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      margin: -34px -24px 26px -24px;
      padding: 26px 16px 20px;
      border-bottom: 4px solid #facc15;
      border-radius: 32px 32px 0 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .hub-title {
      font-size: 2.3rem;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0px #0369a1, 0 0 20px rgba(250, 204, 21, 0.6);
      font-family: 'Chakra Petch', 'Kanit', sans-serif;
      line-height: 1.15;
    }

    .hub-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      background: #facc15;
      color: #713f12;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 4px 16px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #ca8a04;
    }
    .hub-badge svg { width: 16px; height: 16px; fill: #713f12; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 22px 0 16px;
    }

    .game-card {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 6px 0 #cbd5e1;
      cursor: pointer;
      position: relative;
      touch-action: manipulation;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 10px 0 #bae6fd;
    }

    .game-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #cbd5e1;
    }

    .card-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      pointer-events: none;
    }

    .road-theme .card-icon { background: #e0f2fe; }
    .jump-theme .card-icon { background: #fef9c3; }

    .card-icon svg { width: 38px; height: 38px; }
    .road-theme .card-icon svg { fill: #0284c7; }
    .jump-theme .card-icon svg { fill: #ca8a04; }

    .card-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
      pointer-events: none;
    }

    .card-desc {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.45;
      font-weight: 500;
      margin-bottom: 18px;
      pointer-events: none;
    }

    .card-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .road-theme .card-btn {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      box-shadow: 0 4px 0 #075985;
    }

    .jump-theme .card-btn {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 0 #047857;
    }

    .card-btn svg { width: 18px; height: 18px; fill: #ffffff; }

    .footer-note {
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="hub-container">
    
    <div class="header-box">
      <div class="hub-title">WORD ARCADE HUB</div>
      <div class="hub-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
        <span>ศูนย์รวมเกมฝึกทักษะ Microsoft Word ม.1</span>
      </div>
    </div>

    <div class="game-grid">
      
      <!-- การ์ดเกมที่ 1: Word Road -->
      <div class="game-card road-theme" onclick="openGame('word_road')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        </div>
        <div class="card-title">Word Road 3D</div>
        <div class="card-desc">เกมขับรถซิ่งผจญภัย 12 ด่าน ตอบคำถามและกดคีย์ลัดปลดม่านเลเซอร์</div>
        <div class="card-btn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>เข้าเล่นเกมขับรถ</span>
        </div>
      </div>

      <!-- การ์ดเกมที่ 2: Word Jump Game -->
      <div class="game-card jump-theme" onclick="openGame('wordjumpgame')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.59L16.59 13 18 14.41 12 20.41l-6-6L7.41 13 11 16.59V4h2v12.59z" transform="rotate(180 12 12)"/></svg>
        </div>
        <div class="card-title">Word Jump Game</div>
        <div class="card-desc">เกมกระโดดพิชิตคำสั่ง ทดสอบความไวและทบทวนความรู้พื้นฐาน</div>
        <div class="card-btn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>เข้าเล่นเกมกระโดด</span>
        </div>
      </div>

    </div>

    <div class="footer-note">
      เลือกเกมที่ต้องการเล่นเพื่อเริ่มเก็บคะแนนการเรียนรู้
    </div>

  </div>

  <script>
    function openGame(fileName) {
      window.location.assign(fileName);
    }
  </script>

</body>
</html>
