<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 Word Road: 3D Multi-Biome Quest (E1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --cyan: #00f0ff;
      --gold: #facc15;
      --red: #ef4444;
      --green: #22c55e;
      --bg: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .main-frame {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* HUD Bar */
    .hud-bar {
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid var(--cyan);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Chakra Petch', sans-serif;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2);
    }
    .hud-val { color: var(--cyan); font-weight: bold; font-size: 1.15rem; }

    /* 3D Viewport Screen */
    .viewport-3d {
      position: relative;
      width: 100%;
      height: 560px;
      border-radius: 18px;
      overflow: hidden;
      border: 4px solid #334155;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      background: #000;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* แดชบอร์ดคนขับด้านล่าง */
    .dash-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.3) 0%, rgba(10, 15, 29, 0.95) 60%);
      border-top: 3px solid rgba(0, 240, 255, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 35px 14px 35px;
      pointer-events: none;
      z-index: 20;
    }

    .meter-block { font-family: 'Chakra Petch'; text-align: center; }
    .meter-val { font-size: 2.2rem; font-weight: 700; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
    .meter-lbl { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }

    /* On-Screen Touch Controls */
    .controls-layer {
      position: absolute;
      bottom: 14px; left: 14px; right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 30;
    }
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--cyan);
      color: #fff;
      font-family: 'Chakra Petch';
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .ctrl-btn:active { background: var(--cyan); color: #000; }

    /* Flash แดงตอนชน */
    .damage-flash {
      position: absolute;
      inset: 0;
      background: rgba(239, 68, 68, 0.5);
      display: none;
      pointer-events: none;
      z-index: 50;
    }

    /* Terminal เมื่อถึง Checkpoint */
    .stage-terminal {
      position: absolute;
      top: 40px; left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 780px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      border: 2px solid var(--cyan);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.35);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 100;
      pointer-events: auto;
    }
    .term-title {
      font-family: 'Chakra Petch';
      font-size: 1.35rem;
      color: var(--cyan);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .term-q { font-size: 1.15rem; line-height: 1.6; }

    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .opt-grid { grid-template-columns: 1fr; } }

    .opt-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      gap: 10px;
      transition: all 0.2s;
    }
    .opt-btn:hover:not(:disabled) { background: rgba(0, 240, 255, 0.2); border-color: var(--cyan); }
    .opt-btn.correct { background: rgba(34, 197, 94, 0.3) !important; border-color: var(--green) !important; color: var(--green) !important; }
    .opt-btn.wrong { background: rgba(239, 68, 68, 0.3) !important; border-color: var(--red) !important; color: var(--red) !important; }

    .ai-bubble {
      background: rgba(0, 120, 212, 0.15);
      border-left: 4px solid var(--cyan);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: #dbeafe;
    }

    .btn-next-gate {
      background: linear-gradient(135deg, #0078d4, var(--cyan));
      border: none;
      color: #000;
      font-family: 'Chakra Petch';
      font-weight: 700;
      font-size: 1rem;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      align-self: flex-end;
      display: none;
    }
  </style>
</head>
<body>

<div class="main-frame">

  <div class="hud-bar">
    <div>🛡️ พลังเกราะ: <span id="health-ui" class="hud-val">❤️❤️❤️</span></div>
    <div>🚩 ด่านปัจจุบัน: <span id="stage-ui" class="hud-val">ด่าน 1 / 12</span></div>
    <div>⭐ ดาวสะสม: <span id="star-ui" class="hud-val">0 ⭐</span></div>
    <div>📊 ประสิทธิภาพ E1: <span id="e1-ui" class="hud-val" style="color:var(--green)">0%</span></div>
  </div>

  <div class="viewport-3d" id="viewport">
    <div id="webgl-canvas"></div>
    <div class="damage-flash" id="crash-flash"></div>

    <div class="dash-panel">
      <div class="meter-block">
        <div class="meter-val" id="speed-meter">0</div>
        <div class="meter-lbl">SPEED (KM/H)</div>
      </div>
      <div class="meter-block">
        <div class="meter-val" id="dist-meter" style="color:var(--gold)">1000</div>
        <div class="meter-lbl">DIST TO GATE (M)</div>
      </div>
    </div>

    <div class="controls-layer">
      <div style="display:flex; gap:8px;">
        <button class="ctrl-btn" id="btn-left">◀ สลับเลนซ้าย (A)</button>
        <button class="ctrl-btn" id="btn-right">สลับเลนขวา (D) ▶</button>
      </div>
      <button class="ctrl-btn" id="btn-gas" style="background:#0284c7; border-color:var(--cyan);">⚡ เร่งเครื่อง (W / ▲)</button>
    </div>

    <!-- Terminal -->
    <div class="stage-terminal" id="terminal">
      <div class="term-title">
        <span id="term-name">🚧 CHECKPOINT 1</span>
        <span id="term-badge" style="font-size:0.85rem; color:var(--gold);">🏅 Word Beginner</span>
      </div>
      <div class="term-q" id="term-q">...</div>
      <div class="opt-grid" id="term-opts"></div>
      <div class="ai-bubble" id="ai-msg"><strong>Word AI:</strong> ตอบคำถามให้ถูกต้องเพื่อเดินทางต่อ</div>
      <button id="btn-continue" class="btn-next-gate" onclick="continueVoyage()">เดินทางต่อไป ➔</button>
    </div>

  </div>

</div>

<script>
  const stageData = [
    { id: 1, title: "Checkpoint 1: รู้จัก Microsoft Word", topic: "Ribbon & Interface", badge: "Word Beginner", q: "หากต้องการเรียกใช้คำสั่งพื้นฐาน เช่น การเปลี่ยนฟอนต์ จัดย่อหน้า ต้องเลือกดูที่แถบเมนู (Ribbon Tab) ใด?", opts: ["หน้าแรก (Home)", "แทรก (Insert)", "มุมมอง (View)", "รีวิว (Review)"], ans: 0, hint: "แถบปรับแต่งหลักจะรวมอยู่ที่แท็บแรกสุดเสมอ" },
    { id: 2, title: "Checkpoint 2: สร้างและบันทึกเอกสาร", topic: "Save & Save As", badge: "Save Master", q: "หากต้องการบันทึกทับเอกสารเดิมที่เคยตั้งชื่อไว้แล้วทันที ควรใช้คีย์ลัดใด?", opts: ["Ctrl + N", "Ctrl + S", "Ctrl + O", "Ctrl + P"], ans: 1, hint: "S ย่อมาจากคำว่า Save" },
    { id: 3, title: "Checkpoint 3: พิมพ์และแก้ไขข้อความ", topic: "Undo & Redo", badge: "Text Editor", q: "หากพิมพ์ผิดและต้องการ 'ยกเลิกคำสั่งล่าสุด' (Undo) ต้องกดคีย์ลัดใด?", opts: ["Ctrl + Y", "Ctrl + C", "Ctrl + Z", "Ctrl + V"], ans: 2, hint: "ปุ่มย้อนเวลาเอกสารคือปุ่ม Z" },
    { id: 4, title: "Checkpoint 4: จัดรูปแบบตัวอักษร", topic: "Font Styling", badge: "Format Master", q: "สัญลักษณ์ใดบนแถบ Ribbon ใช้สำหรับทำข้อความให้เป็น 'ตัวหนา' (Bold)?", opts: ["ไอคอนตัว I", "ไอคอนตัว U", "ไอคอนตัว B", "ไอคอนตัว X²"], ans: 2, hint: "Bold เริ่มต้นด้วยตัวอักษร B" },
    { id: 5, title: "Checkpoint 5: การจัดตำแหน่งย่อหน้า", topic: "Alignment", badge: "Paragraph Pro", q: "การจัดชื่อหัวข้อรายงานให้อยู่ 'กึ่งกลางหน้ากระดาษ' พอดี ต้องใช้คำสั่งใด?", opts: ["Align Left", "Center (Ctrl + E)", "Align Right", "Justify"], ans: 1, hint: "Center หมายถึงกึ่งกลาง มีคีย์ลัดคือ Ctrl + E" },
    { id: 6, title: "Checkpoint 6: สัญลักษณ์และลำดับเลข", topic: "Bullets & Numbering", badge: "List Architect", q: "รายการขั้นตอนทดลองที่ 'ต้องทำตามลำดับก่อนหลัง' ควรใช้เครื่องมือใด?", opts: ["Bullets (จุดกลม)", "Numbering (ลำดับเลข 1, 2, 3)", "Multilevel List", "Line Spacing"], ans: 1, hint: "ขั้นตอนตายตัวต้องอาศัยลำดับหมายเลข" },
    { id: 7, title: "Checkpoint 7: การแทรกรูปภาพ", topic: "Insert Picture & Wrap Text", badge: "Media Specialist", q: "เมื่อแทรกรูปภาพแล้วขยับตำแหน่งไม่ได้อย่างอิสระ ต้องไปตั้งค่าเครื่องมือใด?", opts: ["Picture Border", "Crop", "Wrap Text (การตัดข้อความ)", "Corrections"], ans: 2, hint: "Wrap Text เช่น Square จะช่วยให้รูปขยับอิสระรอบข้อความ" },
    { id: 8, title: "Checkpoint 8: การจัดการตาราง", topic: "Tables & Merging", badge: "Table Builder", q: "หากต้องการรวมช่องตาราง 2 ช่องเข้าด้วยกันเป็นช่องเดียว ต้องใช้คำสั่งใด?", opts: ["Split Cells", "Merge Cells", "Insert Row", "Delete Column"], ans: 1, hint: "Merge หมายถึงการผสานรวมกัน" },
    { id: 9, title: "Checkpoint 9: ตั้งค่าหน้ากระดาษ", topic: "Margins & Orientation", badge: "Layout Pilot", q: "หากต้องการเปลี่ยนกระดาษจากแนวตั้งให้เป็น 'แนวนอน' ต้องเลือกคำสั่งใด?", opts: ["Margins (ระยะขอบ)", "Orientation (การวางแนว)", "Size (ขนาด)", "Columns (คอลัมน์)"], ans: 1, hint: "Orientation มีให้เลือกระหว่าง Portrait และ Landscape" },
    { id: 10, title: "Checkpoint 10: การตรวจสอบเอกสาร", topic: "Proofing & Spell Check", badge: "Doc Inspector", q: "เส้นหยักสีแดงใต้ข้อความในเอกสาร Word บ่งบอกถึงสิ่งใด?", opts: ["สะกดคำที่อาจผิดพลาด", "ไวยากรณ์ผิดพลาด", "ข้อความเกินขอบ", "คำที่ถูกล็อค"], ans: 0, hint: "เส้นหยักแดง = สะกดคำ, เส้นหยักฟ้า = ไวยากรณ์" },
    { id: 11, title: "Checkpoint 11: การใช้สไตล์อัตโนมัติ", topic: "Heading Styles", badge: "Style Maestro", q: "การกำหนด 'Heading Styles' ให้หัวข้อ มีประโยชน์สูงสุดด้านใด?", opts: ["ลดขนาดไฟล์", "สร้างสารบัญอัตโนมัติได้ทันที", "ป้องกันการก็อปปี้", "แปลงภาษา"], ans: 1, hint: "Heading คือหัวใจของการดึงสารบัญ (Table of Contents)" },
    { id: 12, title: "Checkpoint 12: การส่งออกเอกสารสมบูรณ์", topic: "Export PDF & Finish", badge: "Word Grand Master", q: "หากต้องการส่งงานไปพิมพ์โดยไม่ให้ฟอนต์เพี้ยนหรือหน้าเคลื่อน ควรส่งออกเป็นไฟล์ใด?", opts: [".txt", ".docx", ".pdf", ".html"], ans: 2, hint: "PDF ล็อคโครงสร้างหน้ากระดาษได้คงที่ที่สุด" }
  ];

  // 3 Biomes Config (การตั้งค่า 3 ภูมิประเทศ)
  const biomes = [
    { name: "Meadow Spring (ทุ่งหญ้าสดใส)", sky: 0x60a5fa, ground: 0x15803d, road: 0x334155, fog: 0x93c5fd, foliage: 0x22c55e, trunk: 0x78350f },
    { name: "Sunset Canyon (หุบเขาอาทิตย์อัสดง)", sky: 0xf97316, ground: 0xb45309, road: 0x292524, fog: 0xfdba74, foliage: 0xd97706, trunk: 0x451a03 },
    { name: "Cyber Route (ทางหลวงราตรีนีออน)", sky: 0x0f172a, ground: 0x030712, road: 0x1e1b4b, fog: 0x312e81, foliage: 0x06b6d4, trunk: 0x4f46e5 }
  ];

  let curStage = 0;
  let shields = 3;
  let scoreE1 = 0;
  let stars = 0;
  let stageTries = 0;

  // 3-Lane Positions (แกน X: ซ้าย=-4, กลาง=0, ขวา=4)
  const laneX = [-4.0, 0, 4.0];
  let curLane = 1;
  let targetCamX = 0;
  let carSpeed = 0;
  let distanceGate = 1000;
  let isArrived = false;
  let isGas = false;
  let isBlocked = false; // รถติดสิ่งกีดขวาง

  // Three.js Engine Variables
  let scene, camera, renderer;
  let groundMesh, roadMesh, stripesGroup;
  let mountainGroup;
  let treePool = [];
  let obstaclePool = [];
  let checkpointGate;
  let ambientLight, dirLight;

  function initThree() {
    const container = document.getElementById('webgl-canvas');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 500);
    camera.position.set(0, 2.2, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 50, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    buildScene();
    applyBiome(0);
    bindEvents();
    updateHUD();
    animate();
  }

  function buildScene() {
    // 1. พื้นดินกว้างใหญ่
    const groundGeo = new THREE.PlaneGeometry(600, 600);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
    groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.y = -0.05;
    scene.add(groundMesh);

    // 2. ตัวถนนลาดยาง 3 เลน (กว้าง 13 เมตร)
    const roadGeo = new THREE.PlaneGeometry(13, 600);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
    roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.rotation.x = -Math.PI / 2;
    scene.add(roadMesh);

    // ขอบทางแดง-ขาว
    const curbGeo = new THREE.PlaneGeometry(0.7, 600);
    const curbMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
    const leftCurb = new THREE.Mesh(curbGeo, curbMat);
    leftCurb.rotation.x = -Math.PI / 2;
    leftCurb.position.set(-6.8, 0.01, 0);
    scene.add(leftCurb);

    const rightCurb = leftCurb.clone();
    rightCurb.position.set(6.8, 0.01, 0);
    scene.add(rightCurb);

    // 3. เส้นประแบ่ง 3 เลน
    stripesGroup = new THREE.Group();
    const stripeGeo = new THREE.PlaneGeometry(0.25, 5);
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let z = 0; z > -300; z -= 10) {
      const leftStripe = new THREE.Mesh(stripeGeo, stripeMat);
      leftStripe.rotation.x = -Math.PI / 2;
      leftStripe.position.set(-2.15, 0.02, z);
      stripesGroup.add(leftStripe);

      const rightStripe = new THREE.Mesh(stripeGeo, stripeMat);
      rightStripe.rotation.x = -Math.PI / 2;
      rightStripe.position.set(2.15, 0.02, z);
      stripesGroup.add(rightStripe);
    }
    scene.add(stripesGroup);

    // 4. ภูเขาพาโนรามาด้านหลัง (Low-Poly Mountains)
    mountainGroup = new THREE.Group();
    const mtnGeo = new THREE.ConeGeometry(35, 60, 5);
    const mtnMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
    for (let i = -6; i <= 6; i++) {
      const mtn = new THREE.Mesh(mtnGeo, mtnMat);
      mtn.position.set(i * 35, 25, -280);
      mtn.scale.y = 0.8 + Math.random() * 0.5;
      mountainGroup.add(mtn);
    }
    scene.add(mountainGroup);

    // 5. ต้นไม้ใหญ่ขนาบข้างทาง
    for (let i = 0; i < 24; i++) {
      const tree = createBigTree();
      tree.position.set(i % 2 === 0 ? -12 - Math.random() * 8 : 12 + Math.random() * 8, 0, -i * 16);
      scene.add(tree);
      treePool.push(tree);
    }

    // 6. ซุ้มประตู Checkpoint
    checkpointGate = createGate();
    checkpointGate.position.set(0, 0, -350);
    scene.add(checkpointGate);

    // สิ่งกีดขวางชุดแรกที่ระยะปลอดภัย (ไกล Z = -70 และ -130)
    spawnWave(-70);
    spawnWave(-130);
  }

  function applyBiome(biomeIdx) {
    const b = biomes[biomeIdx];
    scene.background = new THREE.Color(b.sky);
    scene.fog = new THREE.Fog(b.fog, 100, 320);

    groundMesh.material.color.setHex(b.ground);
    roadMesh.material.color.setHex(b.road);

    treePool.forEach(tree => {
      tree.children[0].material.color.setHex(b.trunk);
      tree.children[1].material.color.setHex(b.foliage);
    });
  }

  function createBigTree() {
    const group = new THREE.Group();
    // ลำต้นใหญ่
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.9, 1.2, 7, 7),
      new THREE.MeshLambertMaterial({ color: 0x78350f })
    );
    trunk.position.y = 3.5;
    group.add(trunk);

    // พุ่มไม้ใหญ่
    const foliage = new THREE.Mesh(
      new THREE.DodecahedronGeometry(5.5),
      new THREE.MeshLambertMaterial({ color: 0x22c55e })
    );
    foliage.position.y = 9.5;
    group.add(foliage);

    return group;
  }

  function createGate() {
    const group = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
    const p1 = new THREE.Mesh(new THREE.BoxGeometry(1.4, 12, 1.4), mat);
    p1.position.set(-7, 6, 0);
    const p2 = p1.clone();
    p2.position.set(7, 6, 0);

    const beam = new THREE.Mesh(new THREE.BoxGeometry(16, 2.8, 1.8), new THREE.MeshLambertMaterial({ color: 0x0369a1 }));
    beam.position.set(0, 11, 0);

    group.add(p1); group.add(p2); group.add(beam);
    return group;
  }

  // ระบบการันตี 1 เลนปลอดภัยเสมอ 100%
  function spawnWave(zPos) {
    const types = ['cone', 'barrier'];
    
    // สุ่มเลือก 1 เลนที่ "ต้องปลอดภัยเสมอ"
    const safeLane = Math.floor(Math.random() * 3);
    
    // สิ่งกีดขวางจะเกิดเฉพาะเลนที่เหลือเท่านั้น (สูงสุด 1 หรือ 2 ตัว)
    const availableLanes = [0, 1, 2].filter(l => l !== safeLane);
    const blockCount = Math.random() < 0.4 ? 1 : 2;
    const lanesToBlock = availableLanes.sort(() => Math.random() - 0.5).slice(0, blockCount);

    lanesToBlock.forEach(laneIdx => {
      const obs = createObstacle(types[Math.floor(Math.random() * types.length)]);
      obs.position.set(laneX[laneIdx], 0, zPos);
      obs.lane = laneIdx;
      obs.hit = false;
      scene.add(obs);
      obstaclePool.push(obs);
    });
  }

  function createObstacle(type) {
    const group = new THREE.Group();
    if (type === 'cone') {
      // กรวยส้มขนาดใหญ่เต็มเลน
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(1.6, 3.4, 10),
        new THREE.MeshLambertMaterial({ color: 0xea580c })
      );
      cone.position.y = 1.7;

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(2.6, 0.4, 2.6),
        new THREE.MeshLambertMaterial({ color: 0x1e293b })
      );
      base.position.y = 0.2;
      group.add(base); group.add(cone);
    } else {
      // รั้วไม้กั้นทางขนาดใหญ่เต็มช่องเลน
      const bar = new THREE.Mesh(
        new THREE.BoxGeometry(3.6, 1.5, 0.5),
        new THREE.MeshLambertMaterial({ color: 0xea580c })
      );
      bar.position.y = 1.8;

      const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2, 0.3), new THREE.MeshLambertMaterial({ color: 0x334155 }));
      leg1.position.set(-1.4, 1.0, 0);
      const leg2 = leg1.clone();
      leg2.position.set(1.4, 1.0, 0);

      group.add(bar); group.add(leg1); group.add(leg2);
    }
    return group;
  }

  function switchLane(dir) {
    if (isArrived) return;
    if (dir === -1 && curLane > 0) curLane--;
    else if (dir === 1 && curLane < 2) curLane++;
    targetCamX = laneX[curLane];
    isBlocked = false; // ปลดล็อกสถานะหยุดเมื่อผู้เล่นเปลี่ยนเลนหลบ
  }

  function bindEvents() {
    window.addEventListener('keydown', (e) => {
      if (isArrived) return;
      const k = e.key.toLowerCase();
      if (k === 'w' || e.code === 'ArrowUp') isGas = true;
      if (k === 'a' || e.code === 'ArrowLeft') switchLane(-1);
      if (k === 'd' || e.code === 'ArrowRight') switchLane(1);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.code === 'ArrowUp') isGas = false;
    });

    document.getElementById('btn-left').onclick = () => switchLane(-1);
    document.getElementById('btn-right').onclick = () => switchLane(1);

    const gasBtn = document.getElementById('btn-gas');
    gasBtn.onmousedown = () => isGas = true;
    gasBtn.onmouseup = () => isGas = false;
    gasBtn.ontouchstart = (e) => { e.preventDefault(); isGas = true; };
    gasBtn.ontouchend = (e) => { e.preventDefault(); isGas = false; };
  }

  function updateHUD() {
    let hearts = "";
    for(let i=0; i<3; i++) hearts += (i < shields) ? "❤️" : "🖤";
    document.getElementById('health-ui').innerText = hearts;

    const bIdx = Math.min(2, Math.floor(curStage / 4));
    document.getElementById('stage-ui').innerText = `ด่าน ${curStage + 1} / 12 (${biomes[bIdx].name.split(' ')[0]})`;
    document.getElementById('star-ui').innerText = `${stars} ⭐`;

    const pct = Math.round((scoreE1 / 120) * 100);
    document.getElementById('e1-ui').innerText = `${scoreE1}/120 (${pct}%)`;
  }

  // ระบบชนแล้วรถหยุดสนิท บังคับโยกหลบ
  function triggerCrash() {
    carSpeed = 0; // หยุดรถทันที
    isBlocked = true;
    shields--;
    updateHUD();

    const flash = document.getElementById('crash-flash');
    flash.style.display = 'block';
    setTimeout(() => { flash.style.display = 'none'; }, 300);

    if (shields <= 0) {
      alert("🚨 เกราะรถหมด! เข้าสู่ระบบซ่อมบำรุงฉุกเฉิน (ฟื้นฟูเกราะ 2 หน่วย)");
      shields = 2;
      updateHUD();
    }
  }

  function animate() {
    requestAnimationFrame(animate);

    if (!isArrived) {
      // เร่งความเร็ว (ถ้าติดสิ่งกีดขวางอยู่จะไม่ให้เดินหน้า ต้องเลี้ยวหลบก่อน)
      if (isGas && !isBlocked) {
        carSpeed = Math.min(carSpeed + 1.6, 140);
      } else {
        carSpeed = Math.max(carSpeed - 1.5, 0);
      }

      // สไลด์มุมกล้องเข้าเลนอย่างนุ่มนวล
      camera.position.x += (targetCamX - camera.position.x) * 0.16;

      const delta = carSpeed * 0.012;

      // เลื่อนเส้นประถนน
      stripesGroup.children.forEach(s => {
        s.position.z += delta;
        if (s.position.z > 5) s.position.z -= 300;
      });

      // เลื่อนต้นไม้
      treePool.forEach(t => {
        t.position.z += delta;
        if (t.position.z > 10) t.position.z -= 360;
      });

      // ตรวจสอบสิ่งกีดขวาง
      for (let i = obstaclePool.length - 1; i >= 0; i--) {
        const obs = obstaclePool[i];
        obs.position.z += delta;

        // ชนเมื่ออยู่ในเลนเดียวกันและรถเคลื่อนเข้ามาประชิด (Z = -3.5 ถึง 0.5)
        if (!obs.hit && obs.position.z > -3.5 && obs.position.z < 0.5) {
          if (curLane === obs.lane) {
            obs.hit = true;
            triggerCrash();
          }
        }

        // ลบสิ่งกีดขวางที่หลุดหลังรถ
        if (obs.position.z > 10) {
          scene.remove(obs);
          obstaclePool.splice(i, 1);
        }
      }

      // สุ่มเกิดสิ่งกีดขวางใหม่ที่ระยะ Z = -160
      if (obstaclePool.length < 4 && distanceGate > 300 && Math.random() < 0.02) {
        spawnWave(-160);
      }

      // เลื่อนซุ้มประตูเข้ามา
      distanceGate -= (carSpeed * 0.035);
      if (distanceGate < 400) {
        checkpointGate.position.z = -(distanceGate * 0.8);
      }

      if (distanceGate <= 0) {
        distanceGate = 0;
        carSpeed = 0;
        isArrived = true;
        reachCheckpoint();
      }

      document.getElementById('speed-meter').innerText = Math.round(carSpeed);
      document.getElementById('dist-meter').innerText = Math.round(distanceGate);
    }

    renderer.render(scene, camera);
  }

  function reachCheckpoint() {
    const st = stageData[curStage];
    stageTries = 0;

    const term = document.getElementById('terminal');
    term.style.display = 'flex';

    document.getElementById('term-name').innerText = `🚧 ${st.title.toUpperCase()}`;
    document.getElementById('term-badge').innerText = `🏅 ${st.badge}`;
    document.getElementById('term-q').innerText = st.q;

    const optBox = document.getElementById('term-opts');
    optBox.innerHTML = '';
    st.opts.forEach((txt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span><strong>${String.fromCharCode(65 + i)}.</strong></span> <span>${txt}</span>`;
      btn.onclick = () => answerStage(i);
      optBox.appendChild(btn);
    });

    document.getElementById('btn-continue').style.display = 'none';
  }

  function answerStage(idx) {
    const st = stageData[curStage];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if (idx === st.ans) {
      btns[idx].classList.add('correct');

      let addScore = 10, addStars = 3;
      if (stageTries === 1) { addScore = 7; addStars = 2; }
      else if (stageTries >= 2) { addScore = 5; addStars = 1; }

      scoreE1 += addScore;
      stars += addStars;

      document.getElementById('ai-msg').innerHTML = `
        <strong style="color:var(--green)">Word AI:</strong> คำตอบถูกต้อง! (+${addScore} คะแนน E1 | ${addStars} ⭐)
      `;

      updateHUD();
      document.getElementById('btn-continue').style.display = 'inline-block';

    } else {
      btns[idx].classList.add('wrong');
      stageTries++;
      shields--;
      updateHUD();

      document.getElementById('ai-msg').innerHTML = `
        <strong style="color:var(--red)">Word AI:</strong> ยังไม่ถูกนะ! คำใบ้: ${st.hint}
      `;

      setTimeout(() => {
        btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
      }, 1200);
    }
  }

  function continueVoyage() {
    document.getElementById('terminal').style.display = 'none';
    curStage++;

    if (curStage < 12) {
      distanceGate = 1000;
      isArrived = false;
      isBlocked = false;
      checkpointGate.position.z = -350;

      // ล้างสิ่งกีดขวางเดิมและสุ่มใหม่ที่ระยะปลอดภัย
      obstaclePool.forEach(obs => scene.remove(obs));
      obstaclePool = [];
      spawnWave(-80);

      // สลับธีมแผนที่ตามด่าน (ด่าน 1-4 = ทุ่งหญ้า, 5-8 = หุบเขาส้ม, 9-12 = ราตรีนีออน)
      const bIdx = Math.min(2, Math.floor(curStage / 4));
      applyBiome(bIdx);

      updateHUD();
    } else {
      alert(`🏆 ยินดีด้วย! คุณขับรถพิชิตครบทั้ง 12 Checkpoints สำเร็จแล้ว!\nคะแนนรวม E1: ${scoreE1}/120 (${Math.round((scoreE1/120)*100)}%)\nพร้อมก้าวสู่เกม E2 (Word Jump) ต่อไป!`);
    }
  }

  window.onload = initThree;
</script>
