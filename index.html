<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 Word Road Quest: Drive to Checkpoints (E1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1220;
      --card-bg: rgba(22, 33, 56, 0.95);
      --word-blue: #185abd;
      --neon-cyan: #00e5ff;
      --neon-gold: #ffd600;
      --neon-green: #00e676;
      --neon-red: #ff3d00;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background: radial-gradient(circle at center, #1e2e4f 0%, var(--bg) 90%);
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .game-frame {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .top-bar {
      background: var(--card-bg);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .game-logo {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-metrics { display: flex; gap: 20px; font-family: 'Chakra Petch'; font-size: 1.05rem; }

    #map-view {
      position: relative;
      background: #111a2e;
      border: 3px solid #23385e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas { display: block; width: 100%; height: 580px; }

    .map-instruction {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 18, 32, 0.9);
      border: 1px solid var(--neon-cyan);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--neon-cyan);
      pointer-events: none;
      font-family: 'Chakra Petch';
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* On-Screen Mobile D-Pad */
    .dpad-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      z-index: 10;
    }
    .dpad-btn {
      background: rgba(18, 26, 43, 0.85);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-size: 1.2rem;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .dpad-btn:active { background: var(--neon-cyan); color: #000; }
    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* Stage Mission Screen */
    #stage-view {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.25);
      flex-direction: column;
      gap: 16px;
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }
    .stage-title { font-family: 'Chakra Petch'; font-size: 1.4rem; color: var(--neon-cyan); }
    .badge-pill {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-family: 'Chakra Petch';
    }

    .question-box { font-size: 1.2rem; line-height: 1.6; color: #fff; padding: 6px 0; }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

    .opt-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--neon-cyan);
      transform: translateY(-2px);
    }
    .opt-btn.correct { background: rgba(0, 230, 118, 0.25) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; }
    .opt-btn.wrong { background: rgba(255, 61, 0, 0.25) !important; border-color: var(--neon-red) !important; color: var(--neon-red) !important; }

    .ai-box {
      background: rgba(0, 120, 212, 0.15);
      border-left: 4px solid var(--neon-cyan);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      color: #cbd5e1;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .btn-return-map {
      background: linear-gradient(135deg, var(--word-blue), var(--neon-cyan));
      border: none;
      color: #000;
      font-family: 'Chakra Petch';
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      align-self: flex-end;
      display: none;
    }
    .btn-return-map:hover { filter: brightness(1.2); }

    .repair-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .repair-card {
      background: #141c2d;
      border: 2px solid var(--neon-red);
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

<div class="game-frame">

  <div class="top-bar">
    <div class="game-logo">🚗 WORD ROAD: MANUAL DRIVE</div>
    <div class="hud-metrics">
      <div>❤️ <span id="shield-ui">3/3</span></div>
      <div>⭐ <span id="stars-ui">0</span></div>
      <div>📊 E1: <span id="e1-ui" style="color:var(--neon-green);">0/120 (0%)</span></div>
    </div>
  </div>

  <!-- 1. MAP VIEW -->
  <div id="map-view">
    <div class="map-instruction">
      <span>🕹️ ขับรถด้วยลูกศร / W-A-S-D ไปยัง Checkpoint ด่านถัดไป!</span>
    </div>
    <canvas id="mapCanvas" width="960" height="580"></canvas>
    
    <!-- Mobile D-Pad Buttons -->
    <div class="dpad-controls">
      <button class="dpad-btn btn-up" id="btn-up">▲</button>
      <button class="dpad-btn btn-left" id="btn-left">◀</button>
      <button class="dpad-btn btn-down" id="btn-down">▼</button>
      <button class="dpad-btn btn-right" id="btn-right">▶</button>
    </div>
  </div>

  <!-- 2. STAGE VIEW -->
  <div id="stage-view">
    <div class="stage-header">
      <div>
        <div class="stage-title" id="stage-title">ด่านที่ 1</div>
        <small id="stage-topic" style="color:var(--text-dim);"></small>
      </div>
      <div class="badge-pill" id="stage-badge-target">TARGET: Word Badge</div>
    </div>

    <div class="question-box" id="stage-q">...</div>

    <div class="options-grid" id="stage-options"></div>

    <div class="ai-box">
      <div style="font-size:1.5rem; line-height:1;">🤖</div>
      <div id="ai-guidance"><strong>Word Co-Pilot:</strong> อ่านโจทย์ให้ละเอียดก่อนเลือกคำตอบนะ!</div>
    </div>

    <button id="btn-back-map" class="btn-return-map" onclick="returnToMap()">สำเร็จภารกิจ! กลับไปขับรถต่อ 🚗 ➔</button>
  </div>

</div>

<!-- Repair Modal -->
<div class="repair-modal" id="repair-modal">
  <div class="repair-card">
    <h3 style="color:var(--neon-red); font-family:'Chakra Petch';">🚨 VEHICLE BREAKDOWN (สถานีซ่อมบำรุง)</h3>
    <p id="repair-desc" style="color:#cbd5e1; font-size:0.95rem; line-height:1.5;"></p>
    <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:8px;">
      <strong style="color:var(--neon-cyan);">ภารกิจตอบเพื่อซ่อมรถ:</strong>
      <div id="repair-q" style="margin:8px 0 10px 0;"></div>
      <div id="repair-opts" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
</div>

<script>
  const stageData = [
    { id: 1, title: "Checkpoint 1 — รู้จัก Microsoft Word", topic: "ส่วนประกอบหน้าต่าง Ribbon", badge: "Word Beginner", q: "หากต้องการเรียกใช้คำสั่งพื้นฐาน เช่น ปรับรูปแบบฟอนต์ จัดย่อหน้า ต้องเลือกที่แท็บใด?", opts: ["หน้าแรก (Home)", "แทรก (Insert)", "มุมมอง (View)", "รีวิว (Review)"], ans: 0, hint: "แถบปรับแต่งตัวหนังสือหลักจะอยู่ที่แท็บแรกสุดเสมอ", rq: "แท็บ 'Home' ในภาษาไทยคือเมนูใด?", ro: ["หน้าแรก", "แทรก", "ไฟล์"], ra: 0 },
    { id: 2, title: "Checkpoint 2 — สร้างและบันทึกเอกสาร", topic: "การ Save และ Save As", badge: "Save Master", q: "หากต้องการบันทึกทับไฟล์เดิมทันที ควรใช้คีย์ลัดใด?", opts: ["Ctrl + N", "Ctrl + S", "Ctrl + O", "Ctrl + P"], ans: 1, hint: "S มาจากคำว่า Save", rq: "คีย์ลัด Ctrl + S ใช้ทำสิ่งใด?", ro: ["บันทึกเอกสาร", "เปิดหน้าต่างใหม่", "สั่งพิมพ์"], ra: 0 },
    { id: 3, title: "Checkpoint 3 — พิมพ์และแก้ไขข้อความ", topic: "Undo & Redo", badge: "Text Editor", q: "หากพิมพ์ผิดและต้องการ 'ยกเลิกคำสั่งล่าสุด' (Undo) ต้องกดคีย์ลัดใด?", opts: ["Ctrl + Y", "Ctrl + C", "Ctrl + Z", "Ctrl + V"], ans: 2, hint: "ปุ่มย้อนเวลาเอกสารคือปุ่ม Z", rq: "ปุ่ม Undo มีคีย์ลัดคืออะไร?", ro: ["Ctrl + Z", "Ctrl + X", "Ctrl + A"], ra: 0 },
    { id: 4, title: "Checkpoint 4 — จัดรูปแบบตัวอักษร", topic: "Font Styling", badge: "Format Master", q: "สัญลักษณ์ใดบนแถบ Ribbon ใช้สำหรับทำข้อความให้เป็น 'ตัวหนา' (Bold)?", opts: ["ไอคอนตัว I", "ไอคอนตัว U", "ไอคอนตัว B", "ไอคอนตัว X²"], ans: 2, hint: "Bold เริ่มต้นด้วยอักษร B", rq: "ตัว B หมายถึงสไตล์ข้อความแบบใด?", ro: ["ตัวหนา", "ตัวเอียง", "ขีดเส้นใต้"], ra: 0 },
    { id: 5, title: "Checkpoint 5 — การจัดตำแหน่งย่อหน้า", topic: "Alignment & Spacing", badge: "Paragraph Pro", q: "การจัดชื่อหัวข้อรายงานให้อยู่ 'กึ่งกลางหน้ากระดาษ' ต้องใช้คำสั่งใด?", opts: ["Align Left", "Center (Ctrl + E)", "Align Right", "Justify"], ans: 1, hint: "Center หมายถึงกึ่งกลาง มีคีย์ลัดคือ Ctrl + E", rq: "Center หมายถึงการจัดตำแหน่งแบบใด?", ro: ["ตรงกลาง", "ชิดซ้าย", "ชิดขวา"], ra: 0 },
    { id: 6, title: "Checkpoint 6 — หัวข้อย่อยและลำดับเลข", topic: "Bullets & Numbering", badge: "List Architect", q: "รายการขั้นตอนที่ต้องทำตามลำดับก่อน-หลัง ควรเลือกใช้เครื่องมือใด?", opts: ["Bullets (สัญลักษณ์จุด)", "Numbering (ลำดับ 1, 2, 3)", "Multilevel List", "Line Spacing"], ans: 1, hint: "ขั้นตอนที่ตายตัว ต้องอาศัยลำดับหมายเลข", rq: "เมื่อต้องการระบุ 1, 2, 3 ควรใช้เครื่องมือใด?", ro: ["Numbering", "Bullets", "Table"], ra: 0 },
    { id: 7, title: "Checkpoint 7 — การแทรกรูปภาพ", topic: "Insert Picture & Wrap Text", badge: "Media Specialist", q: "แทรกรูปภาพแล้วขยับตำแหน่งไม่ได้อย่างอิสระ ต้องไปตั้งค่าเครื่องมือใด?", opts: ["Picture Border", "Crop", "Wrap Text (ตัดข้อความ)", "Corrections"], ans: 2, hint: "Wrap Text เช่น Square จะช่วยให้รูปขยับอิสระรอบตัวหนังสือ", rq: "คำสั่งตัดข้อความล้อมรูปภาพเรียกว่าอะไร?", ro: ["Wrap Text", "Shapes", "Icons"], ra: 0 },
    { id: 8, title: "Checkpoint 8 — การจัดการตาราง", topic: "Tables & Cell Merging", badge: "Table Builder", q: "หากต้องการรวมช่องตาราง 2 ช่องเข้าด้วยกันเป็นช่องเดียว ต้องใช้คำสั่งใด?", opts: ["Split Cells", "Merge Cells", "Insert Row", "Delete Column"], ans: 1, hint: "Merge หมายถึงการผสานรวมกัน", rq: "Merge Cells มีหน้าที่อะไร?", ro: ["รวมช่องตาราง", "แบ่งช่องตาราง", "ลบแถว"], ra: 0 },
    { id: 9, title: "Checkpoint 9 — ตั้งค่าหน้ากระดาษ", topic: "Margins & Orientation", badge: "Layout Pilot", q: "เปลี่ยนหน้ากระดาษจากแนวตั้งให้เป็น 'แนวนอน' ต้องเลือกคำสั่งใด?", opts: ["Margins (ระยะขอบ)", "Orientation (การวางแนว)", "Size (ขนาด)", "Columns (คอลัมน์)"], ans: 1, hint: "Orientation มีให้เลือกระหว่าง Portrait และ Landscape", rq: "Landscape ใน Word หมายถึงแนวกระดาษแบบใด?", ro: ["แนวนอน", "แนวตั้ง", "แนวตัด"], ra: 0 },
    { id: 10, title: "Checkpoint 10 — การตรวจสอบเอกสาร", topic: "Proofing & Spell Check", badge: "Doc Inspector", q: "เส้นหยักสีแดงใต้ข้อความในเอกสาร Word บ่งบอกถึงสิ่งใด?", opts: ["สะกดคำที่อาจผิดพลาด", "ไวยากรณ์ผิดพลาด", "ข้อความเกินขอบ", "คำที่ติดรหัสผ่าน"], ans: 0, hint: "เส้นหยักแดง = สะกดคำ, เส้นหยักฟ้า = ไวยากรณ์หรือเว้นวรรค", rq: "เส้นหยักสีแดงแจ้งเตือนเรื่องใด?", ro: ["สะกดคำผิด", "ใส่รูปผิด", "ลบข้อความ"], ra: 0 },
    { id: 11, title: "Checkpoint 11 — การใช้สไตล์อัตโนมัติ", topic: "Styles & TOC", badge: "Style Maestro", q: "การกำหนด 'Heading Styles' ให้หัวข้อ มีประโยชน์สูงสุดด้านใด?", opts: ["ลดขนาดไฟล์", "สร้างสารบัญอัตโนมัติได้ทันที", "ป้องกันการก็อปปี้", "แปลงภาษา"], ans: 1, hint: "Heading คือหัวใจของการดึงสารบัญ (Table of Contents)", rq: "Heading นิยมนำมาใช้ทำอะไร?", ro: ["สร้างสารบัญอัตโนมัติ", "ตกแต่งขอบ", "ใส่ลายน้ำ"], ra: 0 },
    { id: 12, title: "Checkpoint 12 — การส่งออกเอกสาร", topic: "Export PDF & Finish", badge: "Grand Explorer", q: "หากต้องการส่งงานไปพิมพ์โดยไม่ให้ฟอนต์เพี้ยนหรือหน้าเคลื่อน ควรส่งออกเป็นไฟล์ใด?", opts: [".txt", ".docx", ".pdf", ".html"], ans: 2, hint: "PDF ล็อคโครงสร้างหน้ากระดาษได้คงที่ที่สุด", rq: "ไฟล์สกุลใดคงสภาพหน้ากระดาษได้ดีที่สุด?", ro: [".pdf", ".txt", ".rtf"], ra: 0 }
  ];

  const nodeCoords = [
    { x: 120, y: 500 },
    { x: 260, y: 490 },
    { x: 400, y: 450 },
    { x: 540, y: 420 },
    { x: 700, y: 440 },
    { x: 830, y: 380 },
    { x: 800, y: 250 },
    { x: 650, y: 220 },
    { x: 480, y: 240 },
    { x: 300, y: 210 },
    { x: 160, y: 150 },
    { x: 380, y: 90 }
  ];

  let unlockedLevel = 1;
  let activeStage = 1;
  let totalScoreE1 = 0;
  let totalStars = 0;
  let stageResults = {};
  let shields = 3;
  let currentAttempts = 0;
  let isInsideStage = false;

  // Manual Car Physics State
  let car = {
    x: nodeCoords[0].x - 40,
    y: nodeCoords[0].y,
    angle: 0,
    speed: 0,
    maxSpeed: 3.5,
    accel: 0.18,
    friction: 0.94,
    steer: 0.06
  };

  const keys = { up: false, down: false, left: false, right: false };

  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');

  function init() {
    updateHUD();
    bindControls();
    requestAnimationFrame(gameLoop);
  }

  function bindControls() {
    window.addEventListener('keydown', (e) => {
      if (isInsideStage) return;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // Mobile D-Pad Touch/Mouse Events
    const setupDpad = (id, key) => {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); if (!isInsideStage) keys[key] = true; };
      const end = (e) => { e.preventDefault(); keys[key] = false; };
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', end);
    };
    setupDpad('btn-up', 'up');
    setupDpad('btn-down', 'down');
    setupDpad('btn-left', 'left');
    setupDpad('btn-right', 'right');
  }

  function updateHUD() {
    let hearts = "";
    for(let i=0; i<3; i++) hearts += (i < shields) ? "❤️" : "🖤";
    document.getElementById('shield-ui').innerText = hearts;
    document.getElementById('stars-ui').innerText = totalStars;
    const pct = Math.round((totalScoreE1 / 120) * 100);
    document.getElementById('e1-ui').innerText = `${totalScoreE1}/120 (${pct}%)`;
  }

  function gameLoop() {
    if (!isInsideStage) {
      updateCarPhysics();
      checkNodeCollision();
    }
    renderMap();
    requestAnimationFrame(gameLoop);
  }

  function updateCarPhysics() {
    if (keys.up) car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
    else if (keys.down) car.speed = Math.max(car.speed - car.accel, -car.maxSpeed * 0.6);
    else car.speed *= car.friction;

    if (Math.abs(car.speed) > 0.1) {
      const dir = car.speed > 0 ? 1 : -1;
      if (keys.left) car.angle -= car.steer * dir;
      if (keys.right) car.angle += car.steer * dir;
    }

    car.x += Math.cos(car.angle) * car.speed;
    car.y += Math.sin(car.angle) * car.speed;

    // Bounds check
    car.x = Math.max(30, Math.min(canvas.width - 30, car.x));
    car.y = Math.max(30, Math.min(canvas.height - 30, car.y));
  }

  // เช็กว่ารถขับไปชนโหนดด่านไหน
  function checkNodeCollision() {
    nodeCoords.forEach((pt, idx) => {
      const lvl = idx + 1;
      const dist = Math.hypot(car.x - pt.x, car.y - pt.y);
      if (dist < 26) {
        if (lvl <= unlockedLevel) {
          // ถ้าเป็นด่านที่ปลดล็อคแล้ว ให้ตัดเข้าเล่น
          openStageView(lvl);
        } else {
          // ด่านล็อคอยู่ ดีดรถถอยหลังเล็กน้อย
          car.speed = -1.8;
        }
      }
    });
  }

  function renderMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. ฉากพื้นหลังหญ้า/แม่น้ำ
    ctx.fillStyle = '#16233b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#0f3959';
    ctx.beginPath();
    ctx.ellipse(820, 120, 100, 60, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    // 2. ถนนเส้นทางคดเคี้ยว
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 42;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(nodeCoords[0].x, nodeCoords[0].y);
    for (let i = 1; i < nodeCoords.length; i++) {
      ctx.lineTo(nodeCoords[i].x, nodeCoords[i].y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.strokeStyle = '#ffd600';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 12]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 3. โหนดด่านทั้ง 12
    nodeCoords.forEach((pt, idx) => {
      const lvl = idx + 1;
      const isUnlocked = lvl <= unlockedLevel;
      const isPassed = stageResults[lvl] !== undefined;
      const isNextTarget = lvl === unlockedLevel && !isPassed;

      // เอฟเฟกต์วงแหวนกระพริบชี้เป้าหมายด่านถัดไป
      if (isNextTarget) {
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const pulse = 26 + Math.sin(Date.now() * 0.008) * 5;
        ctx.arc(pt.x, pt.y, pulse, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(pt.x + 3, pt.y + 4, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 20, 0, Math.PI * 2);
      if (isPassed) ctx.fillStyle = '#00e676';
      else if (isUnlocked) ctx.fillStyle = '#ffd600';
      else ctx.fillStyle = '#334155';
      ctx.fill();

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = isUnlocked ? '#000' : '#94a3b8';
      ctx.font = 'bold 14px Chakra Petch';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (isUnlocked) ctx.fillText(lvl, pt.x, pt.y);
      else ctx.fillText('🔒', pt.x, pt.y);

      if (isPassed) {
        const starsStr = '⭐'.repeat(stageResults[lvl].stars);
        ctx.font = '10px sans-serif';
        ctx.fillText(starsStr, pt.x, pt.y + 28);
      }
    });

    // 4. วาดรถยนต์ (หมุนตามทิศทางมุม car.angle)
    drawCarManual(car.x, car.y, car.angle);
  }

  function drawCarManual(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    // ล้อรถ
    ctx.fillStyle = '#000';
    ctx.fillRect(-15, -12, 7, 4);
    ctx.fillRect(8, -12, 7, 4);
    ctx.fillRect(-15, 8, 7, 4);
    ctx.fillRect(8, 8, 7, 4);

    // ตัวถังรถสปอร์ต
    ctx.fillStyle = '#ff3d00';
    ctx.beginPath();
    ctx.roundRect(-16, -9, 32, 18, 4);
    ctx.fill();

    // กระจก Cockpit
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.roundRect(-6, -6, 14, 12, 3);
    ctx.fill();

    // ไฟหน้าหน้ารถ
    ctx.fillStyle = '#ffd600';
    ctx.fillRect(14, -8, 3, 4);
    ctx.fillRect(14, 4, 3, 4);

    ctx.restore();
  }

  // เข้าสู่หน้าจอเล่นด่าน
  function openStageView(lvl) {
    isInsideStage = true;
    activeStage = lvl;
    currentAttempts = 0;
    car.speed = 0;
    keys.up = keys.down = keys.left = keys.right = false;

    const stage = stageData[lvl - 1];

    document.getElementById('map-view').style.display = 'none';
    const stageView = document.getElementById('stage-view');
    stageView.style.display = 'flex';

    document.getElementById('stage-title').innerText = stage.title;
    document.getElementById('stage-topic').innerText = `หัวข้อ: ${stage.topic}`;
    document.getElementById('stage-badge-target').innerText = `🏅 ปลดล็อก: ${stage.badge}`;
    document.getElementById('stage-q').innerText = stage.q;
    document.getElementById('ai-guidance').innerHTML = `<strong>Word Co-Pilot:</strong> ขับมาถึงด่านที่ ${lvl} แล้ว! ${stage.hint}`;

    const optsGrid = document.getElementById('stage-options');
    optsGrid.innerHTML = '';
    stage.opts.forEach((txt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span><strong>${String.fromCharCode(65 + i)}.</strong></span> <span>${txt}</span>`;
      btn.onclick = () => checkAnswer(i);
      optsGrid.appendChild(btn);
    });

    document.getElementById('btn-back-map').style.display = 'none';
  }

  function checkAnswer(selectedIndex) {
    const stage = stageData[activeStage - 1];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if (selectedIndex === stage.ans) {
      btns[selectedIndex].classList.add('correct');

      let addScore = 10, addStars = 3;
      if (currentAttempts === 1) { addScore = 7; addStars = 2; }
      else if (currentAttempts >= 2) { addScore = 5; addStars = 1; }

      if (!stageResults[activeStage]) {
        totalScoreE1 += addScore;
        totalStars += addStars;
        stageResults[activeStage] = { score: addScore, stars: addStars };
      }

      document.getElementById('ai-guidance').innerHTML = `
        <strong style="color:var(--neon-green)">Word Co-Pilot:</strong> ถูกต้องยอดเยี่ยม! (+${addScore} คะแนน E1 | ได้รับ ${addStars} ดาว ⭐)
      `;

      updateHUD();
      document.getElementById('btn-back-map').style.display = 'inline-block';

    } else {
      btns[selectedIndex].classList.add('wrong');
      currentAttempts++;
      shields--;
      updateHUD();

      if (shields <= 0) {
        setTimeout(showRepairModal, 600);
      } else {
        document.getElementById('ai-guidance').innerHTML = `
          <strong style="color:var(--neon-red)">Word Co-Pilot:</strong> ยังไม่ถูกต้อง เกราะลด 1 หน่วย! คำใบ้: ${stage.hint}
        `;
        setTimeout(() => {
          btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
        }, 1200);
      }
    }
  }

  function showRepairModal() {
    const stage = stageData[activeStage - 1];
    const modal = document.getElementById('repair-modal');
    document.getElementById('repair-desc').innerText = `ระบบตรวจจับว่าผู้เรียนยังติดขัดในเรื่อง "${stage.topic}" จำง่าย ๆ คือ: ${stage.hint}`;
    document.getElementById('repair-q').innerText = stage.rq;

    const optsBox = document.getElementById('repair-opts');
    optsBox.innerHTML = '';
    stage.ro.forEach((txt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = txt;
      btn.onclick = () => {
        if (idx === stage.ra) {
          alert('🔧 ซ่อมรถสำเร็จ! เติมพลังเกราะกลับคืนมา 2 หน่วย');
          shields = 2;
          modal.style.display = 'none';
          updateHUD();
          const btns = document.querySelectorAll('.opt-btn');
          btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
        } else {
          alert('ยังไม่ถูก ลองอ่านทบทวนใหม่อีกครั้ง');
        }
      };
      optsBox.appendChild(btn);
    });

    modal.style.display = 'flex';
  }

  // ออกจากด่าน กลับมาขับรถต่อบนแผนที่
  function returnToMap() {
    document.getElementById('stage-view').style.display = 'none';
    document.getElementById('map-view').style.display = 'block';
    isInsideStage = false;

    // ถ้าผ่านด่านปัจจุบันที่สูงสุด ให้ปลดล็อคด่านถัดไป
    if (activeStage === unlockedLevel && unlockedLevel < 12) {
      unlockedLevel++;
    } else if (unlockedLevel === 12 && stageResults[12]) {
      alert(`🎉 ยินดีด้วย! คุณพิชิตครบทั้ง 12 Checkpoints แล้ว!\nคะแนนรวม E1: ${totalScoreE1}/120 (${Math.round((totalScoreE1/120)*100)}%)\nพร้อมเข้าสู่เกม E2 (Word Jump) ต่อไป`);
    }

    // ถอยรถออกจากจุดศูนย์กลางโหนดเล็กน้อยเพื่อไม่ให้เด้งเข้าด่านซ้ำทันที
    car.x += Math.cos(car.angle) * 15;
    car.y += Math.sin(car.angle) * 15;
  }

  window.onload = init;
</script>
