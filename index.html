<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 Word Road Quest: Level Map (E1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1220;
      --card-bg: rgba(22, 33, 56, 0.95);
      --word-blue: #185abd;
      --neon-cyan: #00e5ff;
      --neon-gold: #ffd600;
      --neon-green: #00e676;
      --neon-red: #ff3d00;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background: radial-gradient(circle at center, #1e2e4f 0%, var(--bg) 90%);
      color: var(--text);
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .game-frame {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    /* Top Stats Bar */
    .top-bar {
      background: var(--card-bg);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .game-logo {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-metrics { display: flex; gap: 20px; font-family: 'Chakra Petch'; font-size: 1.05rem; }

    /* Map Screen Container */
    #map-view {
      position: relative;
      background: #111a2e;
      border: 3px solid #23385e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    canvas { display: block; width: 100%; height: 580px; }

    /* Floating Dialog inside Map */
    .map-instruction {
      position: absolute;
      top: 14px; left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 18, 32, 0.85);
      border: 1px solid var(--neon-cyan);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--neon-cyan);
      pointer-events: none;
      font-family: 'Chakra Petch';
    }

    /* Stage Mission Screen (Modal Overlay Style) */
    #stage-view {
      display: none;
      background: var(--card-bg);
      border: 2px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.25);
      flex-direction: column;
      gap: 16px;
      position: relative;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }
    .stage-title { font-family: 'Chakra Petch'; font-size: 1.4rem; color: var(--neon-cyan); }
    .badge-pill {
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--neon-cyan);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-family: 'Chakra Petch';
    }

    .question-box { font-size: 1.2rem; line-height: 1.6; color: #fff; padding: 6px 0; }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

    .opt-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .opt-btn:hover:not(:disabled) {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--neon-cyan);
      transform: translateY(-2px);
    }
    .opt-btn.correct { background: rgba(0, 230, 118, 0.25) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; }
    .opt-btn.wrong { background: rgba(255, 61, 0, 0.25) !important; border-color: var(--neon-red) !important; color: var(--neon-red) !important; }

    /* AI Assistant Card */
    .ai-box {
      background: rgba(0, 120, 212, 0.15);
      border-left: 4px solid var(--neon-cyan);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      color: #cbd5e1;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    /* Buttons */
    .btn-return-map {
      background: linear-gradient(135deg, var(--word-blue), var(--neon-cyan));
      border: none;
      color: #000;
      font-family: 'Chakra Petch';
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      align-self: flex-end;
      display: none;
    }
    .btn-return-map:hover { filter: brightness(1.2); }

    /* Repair Overlay */
    .repair-modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .repair-card {
      background: #141c2d;
      border: 2px solid var(--neon-red);
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
  </style>
</head>
<body>

<div class="game-frame">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="game-logo">🚗 WORD ROAD QUEST</div>
    <div class="hud-metrics">
      <div>❤️ <span id="shield-ui">3/3</span></div>
      <div>⭐ <span id="stars-ui">0</span></div>
      <div>📊 E1: <span id="e1-ui" style="color:var(--neon-green);">0/120 (0%)</span></div>
    </div>
  </div>

  <!-- 1. MAP VIEW (แผนที่ถนนคดเคี้ยวแบบเลือกด่าน) -->
  <div id="map-view">
    <div class="map-instruction">🎯 คลิกที่ Checkpoint ที่ปลดล็อคเพื่อเข้าสู่ด่าน</div>
    <canvas id="mapCanvas" width="960" height="580"></canvas>
  </div>

  <!-- 2. STAGE VIEW (หน้าต่างเล่นภารกิจในด่าน) -->
  <div id="stage-view">
    <div class="stage-header">
      <div>
        <div class="stage-title" id="stage-title">ด่านที่ 1</div>
        <small id="stage-topic" style="color:var(--text-dim);"></small>
      </div>
      <div class="badge-pill" id="stage-badge-target">TARGET: Word Badge</div>
    </div>

    <div class="question-box" id="stage-q">...</div>

    <div class="options-grid" id="stage-options"></div>

    <div class="ai-box">
      <div style="font-size:1.5rem; line-height:1;">🤖</div>
      <div id="ai-guidance"><strong>Word Co-Pilot:</strong> อ่านโจทย์ให้ละเอียดก่อนเลือกคำตอบนะ!</div>
    </div>

    <button id="btn-back-map" class="btn-return-map" onclick="returnToMap()">สำเร็จภารกิจ! กลับสู่แผนที่ ➔</button>
  </div>

</div>

<!-- Repair Modal -->
<div class="repair-modal" id="repair-modal">
  <div class="repair-card">
    <h3 style="color:var(--neon-red); font-family:'Chakra Petch';">🚨 VEHICLE BREAKDOWN (สถานีซ่อมบำรุง)</h3>
    <p id="repair-desc" style="color:#cbd5e1; font-size:0.95rem; line-height:1.5;"></p>
    <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:8px;">
      <strong style="color:var(--neon-cyan);">ภารกิจตอบเพื่อซ่อมรถ:</strong>
      <div id="repair-q" style="margin:8px 0 10px 0;"></div>
      <div id="repair-opts" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
</div>

<script>
  // ข้อมูล 12 ด่าน Microsoft Word ม.1
  const stageData = [
    { id: 1, title: "Checkpoint 1 — รู้จัก Microsoft Word", topic: "ส่วนประกอบหน้าต่าง Ribbon", badge: "Word Beginner", q: "หากต้องการเรียกใช้คำสั่งพื้นฐาน เช่น ปรับรูปแบบฟอนต์ จัดย่อหน้า ต้องเลือกที่แท็บใด?", opts: ["หน้าแรก (Home)", "แทรก (Insert)", "มุมมอง (View)", "รีวิว (Review)"], ans: 0, hint: "แถบปรับแต่งตัวหนังสือหลักจะอยู่ที่แท็บแรกสุดเสมอ", rq: "แท็บ 'Home' ในภาษาไทยคือเมนูใด?", ro: ["หน้าแรก", "แทรก", "ไฟล์"], ra: 0 },
    { id: 2, title: "Checkpoint 2 — สร้างและบันทึกเอกสาร", topic: "การ Save และ Save As", badge: "Save Master", q: "หากต้องการบันทึกทับไฟล์เดิมทันที ควรใช้คีย์ลัดใด?", opts: ["Ctrl + N", "Ctrl + S", "Ctrl + O", "Ctrl + P"], ans: 1, hint: "S มาจากคำว่า Save", rq: "คีย์ลัด Ctrl + S ใช้ทำสิ่งใด?", ro: ["บันทึกเอกสาร", "เปิดหน้าต่างใหม่", "สั่งพิมพ์"], ra: 0 },
    { id: 3, title: "Checkpoint 3 — พิมพ์และแก้ไขข้อความ", topic: "Undo & Redo", badge: "Text Editor", q: "หากพิมพ์ผิดและต้องการ 'ยกเลิกคำสั่งล่าสุด' (Undo) ต้องกดคีย์ลัดใด?", opts: ["Ctrl + Y", "Ctrl + C", "Ctrl + Z", "Ctrl + V"], ans: 2, hint: "ปุ่มย้อนเวลาเอกสารคือปุ่ม Z", rq: "ปุ่ม Undo มีคีย์ลัดคืออะไร?", ro: ["Ctrl + Z", "Ctrl + X", "Ctrl + A"], ra: 0 },
    { id: 4, title: "Checkpoint 4 — จัดรูปแบบตัวอักษร", topic: "Font Styling", badge: "Format Master", q: "สัญลักษณ์ใดบนแถบ Ribbon ใช้สำหรับทำข้อความให้เป็น 'ตัวหนา' (Bold)?", opts: ["ไอคอนตัว I", "ไอคอนตัว U", "ไอคอนตัว B", "ไอคอนตัว X²"], ans: 2, hint: "Bold เริ่มต้นด้วยอักษร B", rq: "ตัว B หมายถึงสไตล์ข้อความแบบใด?", ro: ["ตัวหนา", "ตัวเอียง", "ขีดเส้นใต้"], ra: 0 },
    { id: 5, title: "Checkpoint 5 — การจัดตำแหน่งย่อหน้า", topic: "Alignment & Spacing", badge: "Paragraph Pro", q: "การจัดชื่อหัวข้อรายงานให้อยู่ 'กึ่งกลางหน้ากระดาษ' ต้องใช้คำสั่งใด?", opts: ["Align Left", "Center (Ctrl + E)", "Align Right", "Justify"], ans: 1, hint: "Center หมายถึงกึ่งกลาง มีคีย์ลัดคือ Ctrl + E", rq: "Center หมายถึงการจัดตำแหน่งแบบใด?", ro: ["ตรงกลาง", "ชิดซ้าย", "ชิดขวา"], ra: 0 },
    { id: 6, title: "Checkpoint 6 — หัวข้อย่อยและลำดับเลข", topic: "Bullets & Numbering", badge: "List Architect", q: "รายการขั้นตอนที่ต้องทำตามลำดับก่อน-หลัง ควรเลือกใช้เครื่องมือใด?", opts: ["Bullets (สัญลักษณ์จุด)", "Numbering (ลำดับ 1, 2, 3)", "Multilevel List", "Line Spacing"], ans: 1, hint: "ขั้นตอนที่ตายตัว ต้องอาศัยลำดับหมายเลข", rq: "เมื่อต้องการระบุ 1, 2, 3 ควรใช้เครื่องมือใด?", ro: ["Numbering", "Bullets", "Table"], ra: 0 },
    { id: 7, title: "Checkpoint 7 — การแทรกรูปภาพ", topic: "Insert Picture & Wrap Text", badge: "Media Specialist", q: "แทรกรูปภาพแล้วขยับตำแหน่งไม่ได้อย่างอิสระ ต้องไปตั้งค่าเครื่องมือใด?", opts: ["Picture Border", "Crop", "Wrap Text (ตัดข้อความ)", "Corrections"], ans: 2, hint: "Wrap Text เช่น Square จะช่วยให้รูปขยับอิสระรอบตัวหนังสือ", rq: "คำสั่งตัดข้อความล้อมรูปภาพเรียกว่าอะไร?", ro: ["Wrap Text", "Shapes", "Icons"], ra: 0 },
    { id: 8, title: "Checkpoint 8 — การจัดการตาราง", topic: "Tables & Cell Merging", badge: "Table Builder", q: "หากต้องการรวมช่องตาราง 2 ช่องเข้าด้วยกันเป็นช่องเดียว ต้องใช้คำสั่งใด?", opts: ["Split Cells", "Merge Cells", "Insert Row", "Delete Column"], ans: 1, hint: "Merge หมายถึงการผสานรวมกัน", rq: "Merge Cells มีหน้าที่อะไร?", ro: ["รวมช่องตาราง", "แบ่งช่องตาราง", "ลบแถว"], ra: 0 },
    { id: 9, title: "Checkpoint 9 — ตั้งค่าหน้ากระดาษ", topic: "Margins & Orientation", badge: "Layout Pilot", q: "เปลี่ยนหน้ากระดาษจากแนวตั้งให้เป็น 'แนวนอน' ต้องเลือกคำสั่งใด?", opts: ["Margins (ระยะขอบ)", "Orientation (การวางแนว)", "Size (ขนาด)", "Columns (คอลัมน์)"], ans: 1, hint: "Orientation มีให้เลือกระหว่าง Portrait และ Landscape", rq: "Landscape ใน Word หมายถึงแนวกระดาษแบบใด?", ro: ["แนวนอน", "แนวตั้ง", "แนวตัด"], ra: 0 },
    { id: 10, title: "Checkpoint 10 — การตรวจสอบเอกสาร", topic: "Proofing & Spell Check", badge: "Doc Inspector", q: "เส้นหยักสีแดงใต้ข้อความในเอกสาร Word บ่งบอกถึงสิ่งใด?", opts: ["สะกดคำที่อาจผิดพลาด", "ไวยากรณ์ผิดพลาด", "ข้อความเกินขอบ", "คำที่ติดรหัสผ่าน"], ans: 0, hint: "เส้นหยักแดง = สะกดคำ, เส้นหยักฟ้า = ไวยากรณ์หรือเว้นวรรค", rq: "เส้นหยักสีแดงแจ้งเตือนเรื่องใด?", ro: ["สะกดคำผิด", "ใส่รูปผิด", "ลบข้อความ"], ra: 0 },
    { id: 11, title: "Checkpoint 11 — การใช้สไตล์อัตโนมัติ", topic: "Styles & TOC", badge: "Style Maestro", q: "การกำหนด 'Heading Styles' ให้หัวข้อ มีประโยชน์สูงสุดด้านใด?", opts: ["ลดขนาดไฟล์", "สร้างสารบัญอัตโนมัติได้ทันที", "ป้องกันการก็อปปี้", "แปลงภาษา"], ans: 1, hint: "Heading คือหัวใจของการดึงสารบัญ (Table of Contents)", rq: "Heading นิยมนำมาใช้ทำอะไร?", ro: ["สร้างสารบัญอัตโนมัติ", "ตกแต่งขอบ", "ใส่ลายน้ำ"], ra: 0 },
    { id: 12, title: "Checkpoint 12 — การส่งออกเอกสาร", topic: "Export PDF & Finish", badge: "Grand Explorer", q: "หากต้องการส่งงานไปพิมพ์โดยไม่ให้ฟอนต์เพี้ยนหรือหน้าเคลื่อน ควรส่งออกเป็นไฟล์ใด?", opts: [".txt", ".docx", ".pdf", ".html"], ans: 2, hint: "PDF ล็อคโครงสร้างหน้ากระดาษได้คงที่ที่สุด", rq: "ไฟล์สกุลใดคงสภาพหน้ากระดาษได้ดีที่สุด?", ro: [".pdf", ".txt", ".rtf"], ra: 0 }
  ];

  // พิกัด 12 จุดโหนดบนแผนที่แบบคดเคี้ยว (S-Curve Road)
  const nodeCoords = [
    { x: 120, y: 500 }, // ด่าน 1
    { x: 260, y: 490 }, // ด่าน 2
    { x: 400, y: 450 }, // ด่าน 3
    { x: 540, y: 420 }, // ด่าน 4
    { x: 700, y: 440 }, // ด่าน 5
    { x: 830, y: 380 }, // ด่าน 6
    { x: 800, y: 250 }, // ด่าน 7
    { x: 650, y: 220 }, // ด่าน 8
    { x: 480, y: 240 }, // ด่าน 9
    { x: 300, y: 210 }, // ด่าน 10
    { x: 160, y: 150 }, // ด่าน 11
    { x: 380, y: 90 }   // ด่าน 12 เส้นชัย
  ];

  // Game States
  let unlockedLevel = 1; // ด่านสูงสุดที่ปลดล็อคแล้ว
  let activeStage = 1;
  let totalScoreE1 = 0;
  let totalStars = 0;
  let stageResults = {}; // เก็บดาวและคะแนนแต่ละด่าน
  let shields = 3;
  let currentAttempts = 0;

  // Car Animation on Map
  let carPos = { x: nodeCoords[0].x, y: nodeCoords[0].y };
  let carTarget = { x: nodeCoords[0].x, y: nodeCoords[0].y };
  let isCarDriving = false;

  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');

  function init() {
    updateHUD();
    renderMap();
    canvas.addEventListener('click', handleMapClick);
  }

  function updateHUD() {
    let hearts = "";
    for(let i=0; i<3; i++) hearts += (i < shields) ? "❤️" : "🖤";
    document.getElementById('shield-ui').innerText = hearts;
    document.getElementById('stars-ui').innerText = totalStars;
    const pct = Math.round((totalScoreE1 / 120) * 100);
    document.getElementById('e1-ui').innerText = `${totalScoreE1}/120 (${pct}%)`;
  }

  // วาดแผนที่ Overworld Map
  function renderMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. วาดพื้นหญ้าและธรรมชาติ
    ctx.fillStyle = '#16233b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // วาดสระน้ำ/แม่น้ำประดับฉาก
    ctx.fillStyle = '#0f3959';
    ctx.beginPath();
    ctx.ellipse(820, 120, 100, 60, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();

    // 2. วาดถนนคดเคี้ยว (S-Road Path)
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 42;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(nodeCoords[0].x, nodeCoords[0].y);
    for (let i = 1; i < nodeCoords.length; i++) {
      ctx.lineTo(nodeCoords[i].x, nodeCoords[i].y);
    }
    ctx.stroke();

    // ขอบถนนนีออน
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 4;
    ctx.stroke();

    // เส้นประกลางถนน
    ctx.strokeStyle = '#ffd600';
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 12]);
    ctx.stroke();
    ctx.setLineDash([]); // รีเซ็ตเส้นประ

    // 3. วาดโหนดด่านทั้ง 12 จุด
    nodeCoords.forEach((pt, idx) => {
      const lvl = idx + 1;
      const isUnlocked = lvl <= unlockedLevel;
      const isPassed = stageResults[lvl] !== undefined;

      // เงาโหนด
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.arc(pt.x + 3, pt.y + 4, 24, 0, Math.PI * 2);
      ctx.fill();

      // วงกลมหลัก
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 22, 0, Math.PI * 2);
      if (isPassed) {
        ctx.fillStyle = '#00e676'; // ผ่านแล้ว
      } else if (isUnlocked) {
        ctx.fillStyle = '#ffd600'; // ปลดล็อค กำลังรอเล่น
      } else {
        ctx.fillStyle = '#334155'; // ล็อค
      }
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();

      // ตัวเลขด่าน หรือ ไอคอนกุญแจ
      ctx.fillStyle = isUnlocked ? '#000' : '#94a3b8';
      ctx.font = 'bold 15px Chakra Petch';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (isUnlocked) {
        ctx.fillText(lvl, pt.x, pt.y);
      } else {
        ctx.fillText('🔒', pt.x, pt.y);
      }

      // วาดดาวใต้โหนดถ้าเคยเล่นผ่านแล้ว
      if (isPassed) {
        const starCount = stageResults[lvl].stars;
        let starStr = '⭐'.repeat(starCount);
        ctx.font = '11px sans-serif';
        ctx.fillText(starStr, pt.x, pt.y + 32);
      }
    });

    // 4. วาดรถยนต์ (Car) บนแผนที่
    drawCar(carPos.x, carPos.y);

    // Car Movement Animation Lerp
    if (isCarDriving) {
      carPos.x += (carTarget.x - carPos.x) * 0.08;
      carPos.y += (carTarget.y - carPos.y) * 0.08;
      if (Math.hypot(carTarget.x - carPos.x, carTarget.y - carPos.y) < 1) {
        carPos.x = carTarget.x;
        carPos.y = carTarget.y;
        isCarDriving = false;
        // เมื่อขับถึงด่านใหม่ ให้เปิดด่านเข้าเล่นทันที
        openStageView(unlockedLevel);
      }
    }

    requestAnimationFrame(renderMap);
  }

  function drawCar(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // ล้อรถ
    ctx.fillStyle = '#000';
    ctx.fillRect(-16, -14, 8, 6);
    ctx.fillRect(8, -14, 8, 6);
    ctx.fillRect(-16, 8, 8, 6);
    ctx.fillRect(8, 8, 8, 6);

    // ตัวถังรถสปอร์ตสีแดง
    ctx.fillStyle = '#ff3d00';
    ctx.beginPath();
    ctx.roundRect(-18, -10, 36, 20, 5);
    ctx.fill();

    // หลังคากระจก
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.roundRect(-8, -7, 16, 14, 3);
    ctx.fill();

    // สัญลักษณ์ W บนหน้ารถ
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 9px Chakra Petch';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('W', 10, 0);

    ctx.restore();
  }

  // จัดการการคลิกที่โหนดบนแผนที่
  function handleMapClick(e) {
    if (isCarDriving) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    nodeCoords.forEach((pt, idx) => {
      const lvl = idx + 1;
      const dist = Math.hypot(clickX - pt.x, clickY - pt.y);
      if (dist <= 26) {
        if (lvl <= unlockedLevel) {
          // ขยับรถไปจุดนั้นและเข้าด่าน
          carPos.x = pt.x;
          carPos.y = pt.y;
          openStageView(lvl);
        } else {
          alert(`🔒 ด่านที่ ${lvl} ยังล็อคอยู่! ต้องผ่านด่านที่ ${lvl - 1} ก่อน`);
        }
      }
    });
  }

  // สลับหน้า: เปิดหน้าจอทำภารกิจในด่าน
  function openStageView(lvl) {
    activeStage = lvl;
    currentAttempts = 0;
    const stage = stageData[lvl - 1];

    document.getElementById('map-view').style.display = 'none';
    const stageView = document.getElementById('stage-view');
    stageView.style.display = 'flex';

    document.getElementById('stage-title').innerText = stage.title;
    document.getElementById('stage-topic').innerText = `หัวข้อ: ${stage.topic}`;
    document.getElementById('stage-badge-target').innerText = `🏅 ปลดล็อก: ${stage.badge}`;
    document.getElementById('stage-q').innerText = stage.q;
    document.getElementById('ai-guidance').innerHTML = `<strong>Word Co-Pilot:</strong> ยินดีต้อนรับสู่ด่าน ${lvl}! ${stage.hint}`;

    const optsGrid = document.getElementById('stage-options');
    optsGrid.innerHTML = '';
    stage.opts.forEach((txt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span><strong>${String.fromCharCode(65 + i)}.</strong></span> <span>${txt}</span>`;
      btn.onclick = () => checkAnswer(i);
      optsGrid.appendChild(btn);
    });

    document.getElementById('btn-back-map').style.display = 'none';
  }

  function checkAnswer(selectedIndex) {
    const stage = stageData[activeStage - 1];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if (selectedIndex === stage.ans) {
      // ตอบถูก
      btns[selectedIndex].classList.add('correct');

      let addScore = 10, addStars = 3;
      if (currentAttempts === 1) { addScore = 7; addStars = 2; }
      else if (currentAttempts >= 2) { addScore = 5; addStars = 1; }

      // บันทึกเฉพาะรอบที่ดีที่สุด
      if (!stageResults[activeStage]) {
        totalScoreE1 += addScore;
        totalStars += addStars;
        stageResults[activeStage] = { score: addScore, stars: addStars };
      }

      document.getElementById('ai-guidance').innerHTML = `
        <strong style="color:var(--neon-green)">Word Co-Pilot:</strong> ถูกต้องสมบูรณ์แบบ! (+${addScore} คะแนน E1 | ได้รับ ${addStars} ดาว ⭐)
      `;

      updateHUD();
      document.getElementById('btn-back-map').style.display = 'inline-block';

    } else {
      // ตอบผิด
      btns[selectedIndex].classList.add('wrong');
      currentAttempts++;
      shields--;
      updateHUD();

      if (shields <= 0) {
        setTimeout(showRepairModal, 600);
      } else {
        document.getElementById('ai-guidance').innerHTML = `
          <strong style="color:var(--neon-red)">Word Co-Pilot:</strong> ยังไม่ถูกต้อง เกราะรถลดลง 1 หน่วย! คำใบ้: ${stage.hint}
        `;
        setTimeout(() => {
          btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
        }, 1200);
      }
    }
  }

  function showRepairModal() {
    const stage = stageData[activeStage - 1];
    const modal = document.getElementById('repair-modal');
    document.getElementById('repair-desc').innerText = `ระบบตรวจจับว่าผู้เรียนยังติดขัดในเรื่อง "${stage.topic}" จำง่าย ๆ คือ: ${stage.hint}`;
    document.getElementById('repair-q').innerText = stage.rq;

    const optsBox = document.getElementById('repair-opts');
    optsBox.innerHTML = '';
    stage.ro.forEach((txt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = txt;
      btn.onclick = () => {
        if (idx === stage.ra) {
          alert('🔧 ซ่อมรถสำเร็จ! เติมพลังเกราะกลับคืนมา 2 หน่วย');
          shields = 2;
          modal.style.display = 'none';
          updateHUD();
          const btns = document.querySelectorAll('.opt-btn');
          btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
        } else {
          alert('ยังไม่ถูก ลองอ่านทบทวนใหม่อีกครั้ง');
        }
      };
      optsBox.appendChild(btn);
    });

    modal.style.display = 'flex';
  }

  // สลับหน้า: ปิดด่าน กลับสู่แผนที่ และขับรถไปด่านถัดไป
  function returnToMap() {
    document.getElementById('stage-view').style.display = 'none';
    document.getElementById('map-view').style.display = 'block';

    // ถ้าผ่านด่านปัจจุบันที่สูงสุด ให้ปลดล็อคด่านถัดไป และสั่งรถขับไปข้างหน้า
    if (activeStage === unlockedLevel && unlockedLevel < 12) {
      unlockedLevel++;
      carTarget = { x: nodeCoords[unlockedLevel - 1].x, y: nodeCoords[unlockedLevel - 1].y };
      isCarDriving = true; // รถจะแล่นตามถนนไปยังด่านถัดไปอัตโนมัติ
    } else if (unlockedLevel === 12 && stageResults[12]) {
      alert(`🎉 ยินดีด้วย! คุณพิชิตครบทั้ง 12 Checkpoints แล้ว!\nคะแนนรวม E1: ${totalScoreE1}/120 (${Math.round((totalScoreE1/120)*100)}%)\nพร้อมเข้าสู่เกม E2 (Word Jump) ต่อไป`);
    }
  }

  window.onload = init;
</script>
