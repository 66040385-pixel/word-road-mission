<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 Word Road: 4-Worlds Interactive Quest (E1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --word-blue: #0078d4;
      --sky-blue: #38bdf8;
      --grass-green: #22c55e;
      --sunny-gold: #facc15;
      --danger-red: #ef4444;
      --cockpit-frame: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: #0f172a;
      color: #334155;
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-top {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 14px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Chakra Petch', sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      color: #fff;
    }
    .hud-val { color: #38bdf8; font-weight: bold; font-size: 1.1rem; }

    .cockpit-viewport {
      position: relative;
      width: 100%;
      height: 560px;
      border-radius: 20px;
      overflow: hidden;
      border: 5px solid var(--cockpit-frame);
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      background: #87ceeb;
      cursor: pointer;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .cockpit-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .windshield-frame {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 12px 25px rgba(0,0,0,0.3), 
                  inset 24px 0 30px rgba(15,23,42,0.8), 
                  inset -24px 0 30px rgba(15,23,42,0.8);
      border-top: 14px solid #1e293b;
    }

    .dashboard {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 165px;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      border-top: 4px solid #475569;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 30px 14px 30px;
      clip-path: polygon(0 20%, 30% 0, 70% 0, 100% 20%, 100% 100%, 0 100%);
    }

    .steering-wheel-container {
      position: absolute;
      left: 50%;
      bottom: -65px;
      transform: translateX(-50%);
      width: 240px;
      height: 240px;
      transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .wheel-ring {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 20px solid #0f172a;
      border-top-color: #475569;
      box-shadow: inset 0 0 10px #000, 0 8px 16px rgba(0,0,0,0.6);
      position: relative;
    }
    .wheel-hub {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 65px; height: 65px;
      background: #1e293b;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch';
      font-weight: 700;
      color: #38bdf8;
    }
    .wheel-spoke { position: absolute; background: #0f172a; }
    .spoke-h { top: 50%; left: 0; right: 0; height: 14px; transform: translateY(-50%); }
    .spoke-v { bottom: 0; left: 50%; width: 14px; height: 50%; transform: translateX(-50%); }

    .gauge { font-family: 'Chakra Petch', sans-serif; text-align: center; z-index: 5; }
    .gauge-num { font-size: 2.2rem; font-weight: 700; color: #38bdf8; }
    .gauge-label { font-size: 0.75rem; color: #94a3b8; }

    .pedals {
      position: absolute;
      bottom: 14px; left: 14px; right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 20;
    }
    .pedal-btn {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #38bdf8;
      color: #fff;
      font-family: 'Kanit';
      font-weight: 500;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      touch-action: manipulation;
      cursor: pointer;
    }
    .pedal-btn:active { background: #38bdf8; color: #000; }

    .crash-flash {
      position: absolute;
      inset: 0;
      background: rgba(239, 68, 68, 0.45);
      display: none;
      pointer-events: none;
      z-index: 50;
    }

    /* กล่องหน้าต่างมินิเกมปฏิบัติการ */
    .mission-terminal {
      position: absolute;
      top: 30px; left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      background: #ffffff;
      border: 4px solid #38bdf8;
      border-radius: 24px;
      padding: 22px 26px;
      box-shadow: 0 16px 40px rgba(0, 120, 212, 0.25), 0 0 0 8px rgba(56, 189, 248, 0.2);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 100;
      pointer-events: auto;
      animation: popIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes popIn { from { opacity: 0; transform: translate(-50%, 25px) scale(0.95); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

    .terminal-title {
      font-family: 'Kanit';
      font-weight: 600;
      font-size: 1.25rem;
      color: #0284c7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 8px;
    }

    .badge-tag {
      background: #fef08a;
      color: #854d0e;
      border: 2px solid #facc15;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .terminal-q {
      font-size: 1.15rem;
      line-height: 1.5;
      color: #1e293b;
      font-weight: 500;
    }

    /* กล่องพื้นที่เล่นมินิเกม */
    .minigame-stage {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 150px;
      gap: 12px;
    }

    .ai-co-pilot {
      background: #fefce8;
      border: 2px solid #fef08a;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      color: #713f12;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-drive-on {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: #fff;
      font-family: 'Kanit';
      font-weight: 600;
      font-size: 1rem;
      padding: 10px 26px;
      border-radius: 14px;
      cursor: pointer;
      align-self: flex-end;
      box-shadow: 0 4px 0 #0369a1;
      transition: all 0.15s;
      display: none;
    }
    .btn-drive-on:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .btn-drive-on:active { transform: translateY(2px); box-shadow: none; }

    /* สไตล์เฉพาะแต่ละมินิเกม */
    .key-badge {
      display: inline-block;
      background: #e2e8f0;
      border: 2px solid #94a3b8;
      border-radius: 8px;
      padding: 6px 14px;
      font-family: 'Chakra Petch';
      font-weight: 700;
      font-size: 1.3rem;
      color: #0f172a;
      box-shadow: 0 4px 0 #94a3b8;
    }

    .ribbon-bar {
      display: flex;
      gap: 8px;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }
    .ribbon-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: #fff;
      font-family: 'Kanit';
      cursor: pointer;
      font-weight: 500;
    }
    .ribbon-btn:hover { background: #e0f2fe; border-color: #38bdf8; }

    .doc-preview-box {
      width: 220px;
      height: 90px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: all 0.3s;
    }

    .table-picker {
      display: grid;
      grid-template-columns: repeat(4, 32px);
      grid-template-rows: repeat(3, 32px);
      gap: 4px;
    }
    .table-cell {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
    }
    .table-cell.selected { background: #38bdf8; border-color: #0284c7; }
  </style>
</head>
<body tabindex="0">

<div class="main-wrapper">

  <div class="hud-top">
    <div>🛡️ เกราะรถ: <span id="health-val" class="hud-val">❤️❤️❤️</span></div>
    <div>🚩 ด่าน: <span id="cp-track-val" class="hud-val">ด่าน 1 / 12</span></div>
    <div>⭐ ดาวสะสม: <span id="star-val" class="hud-val">0 ⭐</span></div>
    <div>📊 ประสิทธิภาพ E1: <span id="e1-val" class="hud-val" style="color:#4ade80">0%</span></div>
  </div>

  <div class="cockpit-viewport" id="viewport">
    <canvas id="roadCanvas" width="960" height="560"></canvas>
    <div class="crash-flash" id="crash-flash"></div>

    <div class="cockpit-overlay">
      <div class="windshield-frame"></div>

      <div class="dashboard">
        <div class="gauge">
          <div class="gauge-num" id="speed-num">0</div>

        <div class="gauge">
          <div class="gauge-num" id="dist-num" style="color:var(--sunny-gold)">1000</div>

      <div class="steering-wheel-container" id="wheel">
        <div class="wheel-ring">

      <div class="pedals">
        <div style="display:flex; gap:8px;">
          <button class="pedal-btn" id="btn-left">◀ สลับเลนซ้าย (A)</button>
          <button class="pedal-btn" id="btn-right">สลับเลนขวา (D) ▶</button>
        </div>
        <button class="pedal-btn" id="btn-gas" style="background:#0284c7; border-color:#38bdf8;">⚡ เร่งเครื่อง (W / ▲)</button>
      </div>
    </div>

    <!-- Cute Interactive Mission Terminal -->
    <div class="mission-terminal" id="terminal">
      <div class="terminal-title">
        <span id="term-title">🚧 CHECKPOINT 1</span>
        <span class="badge-tag" id="term-badge">🏅 Word Badge</span>
      </div>

      <div class="terminal-q" id="term-q">ภารกิจปฏิบัติการ...</div>

      <!-- พื้นที่จำลองมินิเกมของด่าน -->
      <div class="minigame-stage" id="minigame-area"></div>

      <div class="ai-co-pilot">
        <div style="font-size:1.6rem;">🤖</div>
        <div id="ai-tip"><strong>Word Co-Pilot:</strong> ลอดซุ้มด่านสำเร็จ! ลงมือทำภารกิจเพื่อไปต่อ</div>
      </div>

      <button id="btn-drive" class="btn-drive-on" onclick="continueDriving()">ผ่านภารกิจ! ลุยต่อ ➔</button>
    </div>

  </div>

</div>

<script>
  // โครงสร้าง 4 Worlds x 3 Checkpoints = 12 ด่าน พร้อมโหมดมินิเกมจริง
  const stageData = [
    // World 1: Starter Highway (ทุ่งหญ้าสดใส - คีย์ลัดและพื้นฐาน)
    { id: 1, world: "World 1: Starter Highway", title: "Checkpoint 1: เมนูแถบ Ribbon", badge: "Word Beginner", mode: "ribbon", q: "ภารกิจ: ต้องการเปลี่ยนแบบตัวอักษรและจัดย่อหน้า คลิกเลือกแท็บเมนูที่ถูกต้องบนแถบ Ribbon:", target: "Home", hint: "คำสั่งเปลี่ยนฟอนต์ จัดขนาด จะรวมอยู่ที่แท็บหลัก 'Home (หน้าแรก)'" },
    { id: 2, world: "World 1: Starter Highway", title: "Checkpoint 2: บันทึกงานด่วน", badge: "Save Master", mode: "shortcut", q: "ภารกิจด่วน: เอกสารพร้อมแล้ว! กดคีย์ลัดบนแป้นพิมพ์เพื่อ 'บันทึกไฟล์ (Save)':", keyReq: "s", displayKey: "Ctrl + S", hint: "คีย์ลัดเซฟไฟล์คือการกดปุ่ม Ctrl ค้างไว้แล้วตามด้วยปุ่ม S" },
    { id: 3, world: "World 1: Starter Highway", title: "Checkpoint 3: ย้อนเวลากู้ข้อความ", badge: "Text Editor", mode: "shortcut", q: "ภารกิจด่วน: เผลอลบข้อความสำคัญทิ้ง! กดคีย์ลัดเพื่อ 'ยกเลิกคำสั่ง (Undo)':", keyReq: "z", displayKey: "Ctrl + Z", hint: "ปุ่มย้อนเวลากลับมาคือ Ctrl ค้างไว้แล้วตามด้วยปุ่ม Z" },

    // World 2: Typography Canyon (หุบเขาอาทิตย์อัสดง - จัดรูปแบบและย่อหน้า)
    { id: 4, world: "World 2: Typography Canyon", title: "Checkpoint 4: ทำหัวข้อตัวหนา", badge: "Format Master", mode: "shortcut", q: "ภารกิจด่วน: ทำหัวข้อให้โดดเด่นสะดุดตา! กดคีย์ลัดเพื่อทำข้อความ 'ตัวหนา (Bold)':", keyReq: "b", displayKey: "Ctrl + B", hint: "Bold เริ่มต้นด้วยตัว B คีย์ลัดคือ Ctrl + B" },
    { id: 5, world: "World 2: Typography Canyon", title: "Checkpoint 5: จัดกึ่งกลางหน้ากระดาษ", badge: "Paragraph Pro", mode: "align", q: "ภารกิจ: หัวข้อรายงานต้องอยู่กึ่งกลางพอดี คลิกปุ่มจัดตำแหน่งเอกสารให้ถูกต้อง:", target: "center", hint: "กดเลือกคำสั่ง Center เพื่อย้ายข้อความมาตรงกลางพอดี" },
    { id: 6, world: "World 2: Typography Canyon", title: "Checkpoint 6: ลำดับขั้นตอนทดลอง", badge: "List Architect", mode: "ribbon_list", q: "ภารกิจ: ต้องการใส่ลำดับขั้นตอน 1, 2, 3 ให้ข้อความ คลิกเลือกเครื่องมือที่ถูกต้อง:", target: "Numbering", hint: "สิ่งที่มีลำดับก่อน-หลัง ต้องใช้ Numbering (ตัวเลข)" },

    // World 3: Media & Table Valley (ทะเลสาบกราฟิกและตาราง)
    { id: 7, world: "World 3: Media & Table Valley", title: "Checkpoint 7: ปลดล็อกรูปภาพอิสระ", badge: "Media Specialist", mode: "wrap_text", q: "ภารกิจ: รูปภาพขยับไม่ได้! เลือกการตัดข้อความ (Wrap Text) เพื่อให้รูปเลื่อนอิสระ:", target: "Square", hint: "การเลือก Square (จัตุรัส) จะช่วยให้ข้อความล้อมรอบภาพและเลื่อนได้คล่องตัว" },
    { id: 8, world: "World 3: Media & Table Valley", title: "Checkpoint 8: สร้างตารางข้อมูล", badge: "Table Builder", mode: "table_grid", q: "ภารกิจ: โจทย์สั่งให้สร้างตารางขนาด '3 คอลัมน์ x 2 แถว' ลากคลุมช่องตารางให้ถูกต้อง:", targetCols: 3, targetRows: 2, hint: "เอาเมาส์จิ้มที่ช่องตาราง แนวนอน 3 ช่อง และแนวตั้ง 2 ช่อง" },
    { id: 9, world: "World 3: Media & Table Valley", title: "Checkpoint 9: ปรับกระดาษแนวนอน", badge: "Layout Pilot", mode: "orientation", q: "ภารกิจ: แผนภูมิต้องใช้พื้นที่กว้าง! ปรับเปลี่ยนการวางหน้ากระดาษเป็น 'แนวนอน (Landscape)':", target: "landscape", hint: "Landscape คือกระดาษแนวนอน ส่วน Portrait คือแนวตั้ง" },

    // World 4: Pro Document City (นครไอที - สารบัญและการส่งออก)
    { id: 10, world: "World 4: Pro Document City", title: "Checkpoint 10: ตรวจจับคำสะกดผิด", badge: "Doc Inspector", mode: "spell_check", q: "ภารกิจ: ข้อความใดในหน้าเอกสารมี 'เส้นหยักสีแดง' แจ้งเตือนสะกดคำผิด คลิกตรวจคำ:", target: "word_error", hint: "เส้นหยักสีแดงใน Word เตือนว่าคำนั้นอาจสะกดไม่ถูกต้อง" },
    { id: 11, world: "World 4: Pro Document City", title: "Checkpoint 11: สร้างสารบัญอัตโนมัติ", badge: "Style Maestro", mode: "styles", q: "ภารกิจ: เตรียมดึงสารบัญรายงาน! คลิกเลือกสไตล์ที่ต้องนำไปครอบหัวข้อหลัก:", target: "Heading 1", hint: "Heading 1 ใช้สำหรับกำหนดหัวข้อหลักในการดึง Table of Contents" },
    { id: 12, world: "World 4: Pro Document City", title: "Checkpoint 12: ส่งออกไฟล์พิมพ์งาน", badge: "Word Grand Master", mode: "export_pdf", q: "ภารกิจสุดท้าย: ส่งงานไปพิมพ์ที่ร้านโดยไม่ให้หน้าเคลื่อนหรือฟอนต์เพี้ยน คลิกเลือกสกุลไฟล์:", target: ".pdf", hint: "ไฟล์ PDF เป็นมาตรฐานที่ล็อคหน้ากระดาษและฟอนต์ไม่ให้เพี้ยน 100%" }
  ];

  // ธีมทัศนียภาพของ 4 Worlds
  const worldThemes = [
    { name: "World 1: Starter Highway", skyTop: "#38bdf8", skyBottom: "#e0f2fe", grass: "#16a34a", mountain: "#4ade80", road: "#334155" },
    { name: "World 2: Typography Canyon", skyTop: "#f97316", skyBottom: "#ffedd5", grass: "#b45309", mountain: "#ea580c", road: "#292524" },
    { name: "World 3: Media & Table Valley", skyTop: "#0ea5e9", skyBottom: "#e0f2fe", grass: "#059669", mountain: "#34d399", road: "#1e293b" },
    { name: "World 4: Pro Document City", skyTop: "#1e1b4b", skyBottom: "#312e81", grass: "#0f172a", mountain: "#4338ca", road: "#020617" }
  ];

  let currentStageIndex = 0;
  let shields = 3;
  let totalScoreE1 = 0;
  let totalStars = 0;
  let taskCompleted = false;

  let speed = 0;
  let maxSpeed = 160;
  let roadPosition = 0;
  let distanceToNextGate = 1000;
  let isArrivedAtGate = false;
  let steeringAngle = 0;

  const laneOffsets = [-1.0, 0.0, 1.0];
  let currentLane = 1;
  let targetX = 0.0;
  let currentX = 0.0;

  let obstacles = [];

  // ระบบการันตี 1 เลนว่างเสมอ ไม่เกิดซ้ำซ้อน
  function spawnObstacleWave(startZ) {
    const types = ['cone', 'barrier', 'broken_car'];
    const safeLane = Math.floor(Math.random() * 3); // ล็อก 1 เลนปลอดภัยเสมอ
    const blockedLanes = [0, 1, 2].filter(l => l !== safeLane);
    const count = Math.random() < 0.45 ? 1 : 2;
    const finalLanes = blockedLanes.sort(() => Math.random() - 0.5).slice(0, count);

    finalLanes.forEach(laneIdx => {
      obstacles.push({
        z: startZ,
        lane: laneIdx,
        type: types[Math.floor(Math.random() * types.length)],
        hit: false
      });
    });
  }

  let roadsideItems = [];
  for (let i = 0; i < 12; i++) {
    roadsideItems.push({ z: (i / 12), side: i % 2 === 0 ? -1 : 1, type: 'tree' });
  }

  let clouds = [
    { x: 50, y: 50, scale: 1.2 },
    { x: 300, y: 30, scale: 0.8 },
    { x: 600, y: 65, scale: 1.0 },
    { x: 820, y: 40, scale: 1.4 }
  ];

  let isGasPressed = false;
  const canvas = document.getElementById('roadCanvas');
  const ctx = canvas.getContext('2d');
  const wheelEl = document.getElementById('wheel');

  function init() {
    bindControls();
    updateHUD();
    obstacles = [];
    spawnObstacleWave(0.1);
    requestAnimationFrame(gameLoop);
  }

  function changeLane(direction) {
    if (isArrivedAtGate) return;
    if (direction === -1 && currentLane > 0) {
      currentLane--;
      steeringAngle = -35;
    } else if (direction === 1 && currentLane < 2) {
      currentLane++;
      steeringAngle = 35;
    }
    targetX = laneOffsets[currentLane];
  }

  function bindControls() {
    window.onkeydown = (e) => {
      // ดักจับคีย์ลัดเฉพาะตอนอยู่ในมินิเกม
      if (isArrivedAtGate && !taskCompleted) {
        handleMinigameKeyboard(e);
        return;
      }

      const key = e.key.toLowerCase();
      const code = e.code;
      if (code === 'KeyW' || key === 'w' || code === 'ArrowUp' || key === 'arrowup') {
        isGasPressed = true;
        e.preventDefault();
      }
      if (code === 'KeyA' || key === 'a' || code === 'ArrowLeft' || key === 'arrowleft') {
        changeLane(-1);
        e.preventDefault();
      }
      if (code === 'KeyD' || key === 'd' || code === 'ArrowRight' || key === 'arrowright') {
        changeLane(1);
        e.preventDefault();
      }
    };

    window.onkeyup = (e) => {
      const key = e.key.toLowerCase();
      const code = e.code;
      if (code === 'KeyW' || key === 'w' || code === 'ArrowUp' || key === 'arrowup') {
        isGasPressed = false;
      }
    };

    document.getElementById('btn-left').onclick = (e) => { e.preventDefault(); changeLane(-1); };
    document.getElementById('btn-right').onclick = (e) => { e.preventDefault(); changeLane(1); };

    const gasBtn = document.getElementById('btn-gas');
    const startGas = (e) => { e.preventDefault(); if (!isArrivedAtGate) isGasPressed = true; };
    const endGas = (e) => { e.preventDefault(); isGasPressed = false; };
    gasBtn.onmousedown = startGas;
    gasBtn.onmouseup = endGas;
    gasBtn.ontouchstart = startGas;
    gasBtn.ontouchend = endGas;
  }

  function updateHUD() {
    let hearts = "";
    for(let i=0; i<3; i++) hearts += (i < shields) ? "❤️" : "🖤";
    document.getElementById('health-val').innerText = hearts;

    const currentWorldIndex = Math.floor(currentStageIndex / 3);
    const worldShort = `W${currentWorldIndex + 1}`;
    document.getElementById('cp-track-val').innerText = `${worldShort}: ด่าน ${currentStageIndex + 1} / 12`;
    document.getElementById('star-val').innerText = `${totalStars} ⭐`;

    const pct = Math.round((totalScoreE1 / 120) * 100);
    document.getElementById('e1-val').innerText = `${totalScoreE1}/120 (${pct}%)`;
  }

  function triggerCrash() {
    speed = Math.max(15, speed * 0.2);
    shields--;
    updateHUD();

    const flash = document.getElementById('crash-flash');
    flash.style.display = 'block';
    setTimeout(() => { flash.style.display = 'none'; }, 250);

    if (shields <= 0) {
      alert("🚨 เกราะรถหมด! เข้าสู่ระบบซ่อมบำรุงฉุกเฉิน (ฟื้นฟูเกราะ 2 หน่วย)");
      shields = 2;
      updateHUD();
    }
  }

  function gameLoop() {
    if (!isArrivedAtGate) {
      if (isGasPressed) speed = Math.min(speed + 2.2, maxSpeed);
      else speed = Math.max(speed - 1.2, 0);

      currentX += (targetX - currentX) * 0.22;
      steeringAngle *= 0.82;
      wheelEl.style.transform = `translateX(-50%) rotate(${steeringAngle}deg)`;

      roadPosition += speed;
      distanceToNextGate -= (speed * 0.04);

      clouds.forEach(c => {
        c.x += 0.15;
        if (c.x > canvas.width + 120) c.x = -120;
      });

      roadsideItems.forEach(item => {
        item.z += (speed * 0.00015);
        if (item.z >= 1) item.z -= 1;
      });

      // ตรวจสอบสิ่งกีดขวาง
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.z += (speed * 0.00016);

        if (!obs.hit && obs.z > 0.72 && obs.z < 0.94) {
          if (speed > 5 && currentLane === obs.lane) {
            obs.hit = true;
            triggerCrash();
          }
        }

        if (obs.z >= 1.05) obstacles.splice(i, 1);
      }

      // เกิดระลอกใหม่เมื่อชุดเก่าผ่านไปไกลเกิน z > 0.55
      const closestObstacleZ = obstacles.reduce((min, o) => Math.min(min, o.z), 1.0);
      if (closestObstacleZ > 0.55 && distanceToNextGate > 350) {
        spawnObstacleWave(0.04);
      }

      if (distanceToNextGate <= 0) {
        distanceToNextGate = 0;
        speed = 0;
        isArrivedAtGate = true;
        arriveAtCheckpoint();
      }

      document.getElementById('speed-num').innerText = Math.round(speed);
      document.getElementById('dist-num').innerText = Math.round(distanceToNextGate);
    }

    render3DScene();
    requestAnimationFrame(gameLoop);
  }

  function render3DScene() {
    const w = canvas.width;
    const h = canvas.height;
    const horizon = h * 0.44;

    const worldIndex = Math.floor(currentStageIndex / 3);
    const theme = worldThemes[worldIndex];

    ctx.clearRect(0, 0, w, h);

    // 1. ท้องฟ้าประจำ World
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGrad.addColorStop(0, theme.skyTop);
    skyGrad.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, horizon);

    // พระอาทิตย์
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(820, 65, 34, 0, Math.PI * 2);
    ctx.fill();

    clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

    // 2. เนินเขาประจำ World
    ctx.fillStyle = theme.mountain;
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    ctx.quadraticCurveTo(200, horizon - 35, 450, horizon);
    ctx.quadraticCurveTo(700, horizon - 45, w, horizon);
    ctx.fill();

    // 3. ทุ่งหญ้าเนียนเรียบ
    ctx.fillStyle = theme.grass;
    ctx.fillRect(0, horizon, w, h - horizon);

    // 4. ถนน 3 เลน
    const roadW_near = w * 1.1;
    const roadW_far = w * 0.16;

    const x_near = (w / 2) - (currentX * (roadW_near * 0.33));
    const x_far = (w / 2) - (currentX * (roadW_far * 0.33) * 0.8);

    // ไหล่ทางแดง-ขาว
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(x_far - roadW_far * 0.54, horizon);
    ctx.lineTo(x_near - roadW_near * 0.54, h);
    ctx.lineTo(x_near + roadW_near * 0.54, h);
    ctx.lineTo(x_far + roadW_far * 0.54, horizon);
    ctx.fill();

    // ผิวถนน
    ctx.fillStyle = theme.road;
    ctx.beginPath();
    ctx.moveTo(x_far - roadW_far * 0.5, horizon);
    ctx.lineTo(x_near - roadW_near * 0.5, h);
    ctx.lineTo(x_near + roadW_near * 0.5, h);
    ctx.lineTo(x_far + roadW_far * 0.5, horizon);
    ctx.fill();

    // เส้นประแบ่ง 3 เลน
    const segments = 40;
    for (let i = 0; i < segments; i++) {
      const isStripe = Math.floor((roadPosition * 0.08 - i)) % 2 === 0;
      if (!isStripe) continue;

      const z1 = i / segments;
      const z2 = (i + 1) / segments;

      const y1 = horizon + Math.pow(z1, 2.6) * (h - horizon);
      const y2 = horizon + Math.pow(z2, 2.6) * (h - horizon);

      const rW1 = roadW_far + (roadW_near - roadW_far) * Math.pow(z1, 2.6);
      const rW2 = roadW_far + (roadW_near - roadW_far) * Math.pow(z2, 2.6);

      const rx1 = (w / 2) - (currentX * (rW1 * 0.33));
      const rx2 = (w / 2) - (currentX * (rW2 * 0.33));

      const laneW1 = rW1 / 3;
      const laneW2 = rW2 / 3;
      const lineW1 = rW1 * 0.016;
      const lineW2 = rW2 * 0.016;

      ctx.fillStyle = '#ffffff';

      const l1_x1 = rx1 - (laneW1 * 0.5);
      const l1_x2 = rx2 - (laneW2 * 0.5);
      ctx.beginPath();
      ctx.moveTo(l1_x1 - lineW1, y1); ctx.lineTo(l1_x2 - lineW2, y2);
      ctx.lineTo(l1_x2 + lineW2, y2); ctx.lineTo(l1_x1 + lineW1, y1);
      ctx.fill();

      const l2_x1 = rx1 + (laneW1 * 0.5);
      const l2_x2 = rx2 + (laneW2 * 0.5);
      ctx.beginPath();
      ctx.moveTo(l2_x1 - lineW1, y1); ctx.lineTo(l2_x2 - lineW2, y2);
      ctx.lineTo(l2_x2 + lineW2, y2); ctx.lineTo(l2_x1 + lineW1, y1);
      ctx.fill();
    }

    // 5. ต้นไม้ข้างทาง
    let sortedItems = [...roadsideItems].sort((a, b) => a.z - b.z);
    sortedItems.forEach(item => {
      const z = item.z;
      const y = horizon + Math.pow(z, 2.6) * (h - horizon);
      const roadW = roadW_far + (roadW_near - roadW_far) * Math.pow(z, 2.6);
      const roadCenterX = (w / 2) - (currentX * (roadW * 0.33));
      const scale = Math.pow(z, 2.0);
      const itemX = roadCenterX + (item.side * (roadW * 0.56 + scale * 160));

      drawBigTree(itemX, y, scale);
    });

    // 6. สิ่งกีดขวาง
    let sortedObstacles = [...obstacles].sort((a, b) => a.z - b.z);
    sortedObstacles.forEach(obs => {
      const z = obs.z;
      if (z <= 0.02 || z >= 1.02) return;

      const y = horizon + Math.pow(z, 2.6) * (h - horizon);
      const roadW = roadW_far + (roadW_near - roadW_far) * Math.pow(z, 2.6);
      const roadCenterX = (w / 2) - (currentX * (roadW * 0.33));
      const scale = Math.pow(z, 2.0);
      const laneWidth = (roadW / 3);

      const laneOffset = laneOffsets[obs.lane] * laneWidth;
      const obsX = roadCenterX + laneOffset;

      if (obs.type === 'cone') drawTrafficConeBig(obsX, y, scale, laneWidth);
      else if (obs.type === 'barrier') drawBarricadeBig(obsX, y, scale, laneWidth);
      else if (obs.type === 'broken_car') drawBrokenCarBig(obsX, y, scale, laneWidth);
    });

    // 7. ซุ้มประตู Checkpoint โอ่อ่า
    if (distanceToNextGate < 450) {
      const gateProgress = (1 - (distanceToNextGate / 450));
      const gateScale = Math.pow(gateProgress, 2.1);
      drawGrandArchway(gateScale, gateProgress);
    }
  }

  function drawGrandArchway(gateScale, gateProgress) {
    if (gateScale < 0.04) return;
    const w = canvas.width;
    const h = canvas.height;
    const horizon = h * 0.44;

    const roadW_near = w * 1.1;
    const roadW_far = w * 0.16;
    const currentRoadW = roadW_far + (roadW_near - roadW_far) * gateScale;
    const roadCenter = (w / 2) - (currentX * (currentRoadW * 0.33));

    const groundY = horizon + gateScale * (h - horizon - 30);
    const archW = currentRoadW * 1.24;
    const archH = 220 * gateScale;
    const topBarH = 55 * gateScale;
    const archTopY = groundY - archH;

    const leftX = roadCenter - (archW / 2);
    const rightX = roadCenter + (archW / 2);
    const postW = 28 * gateScale;

    ctx.save();

    // ฐานคอนกรีตนอกถนน
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(leftX - postW * 0.3, groundY - 12 * gateScale, postW * 1.6, 14 * gateScale, 3 * gateScale);
    ctx.roundRect(rightX - postW * 1.3, groundY - 12 * gateScale, postW * 1.6, 14 * gateScale, 3 * gateScale);
    ctx.fill();

    // เสาค้ำคู่
    const pillarGrad = ctx.createLinearGradient(leftX, 0, leftX + postW, 0);
    pillarGrad.addColorStop(0, '#0284c7');
    pillarGrad.addColorStop(0.5, '#38bdf8');
    pillarGrad.addColorStop(1, '#0369a1');

    ctx.fillStyle = pillarGrad;
    ctx.fillRect(leftX, archTopY + topBarH * 0.8, postW, archH - topBarH * 0.8);
    ctx.fillRect(rightX - postW, archTopY + topBarH * 0.8, postW, archH - topBarH * 0.8);

    ctx.fillStyle = '#facc15';
    ctx.fillRect(leftX + postW * 0.35, archTopY + topBarH, postW * 0.3, archH - topBarH - 12 * gateScale);
    ctx.fillRect(rightX - postW * 0.65, archTopY + topBarH, postW * 0.3, archH - topBarH - 12 * gateScale);

    // คานป้ายด้านบน
    const signLeft = leftX - 10 * gateScale;
    const signW = archW + 20 * gateScale;

    const signGrad = ctx.createLinearGradient(0, archTopY, 0, archTopY + topBarH);
    signGrad.addColorStop(0, '#0078d4');
    signGrad.addColorStop(0.5, '#106ebe');
    signGrad.addColorStop(1, '#004578');

    ctx.fillStyle = signGrad;
    ctx.beginPath();
    ctx.roundRect(signLeft, archTopY, signW, topBarH, 8 * gateScale);
    ctx.fill();

    ctx.fillStyle = '#facc15';
    ctx.fillRect(signLeft, archTopY, signW, 4 * gateScale);
    ctx.fillRect(signLeft, archTopY + topBarH - 4 * gateScale, signW, 4 * gateScale);

    // แถบธงตาหมากรุก
    const checkH = 14 * gateScale;
    const checkY = archTopY + topBarH;
    const checkSize = 14 * gateScale;
    const numChecks = Math.ceil(signW / checkSize);

    for (let c = 0; c < numChecks; c++) {
      ctx.fillStyle = (c % 2 === 0) ? '#0f172a' : '#ffffff';
      ctx.fillRect(signLeft + (c * checkSize), checkY, checkSize, checkH);
    }

    // หมายเลขด่าน
    const badgeR = 24 * gateScale;
    const badgeX = signLeft + 35 * gateScale;
    const badgeY = archTopY + topBarH / 2;

    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.font = `bold ${Math.max(10, 18 * gateScale)}px 'Chakra Petch'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${currentStageIndex + 1}`, badgeX, badgeY);

    // ข้อความ Checkpoint
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.max(10, 19 * gateScale)}px 'Chakra Petch'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const stageTitle = `CHECKPOINT ${currentStageIndex + 1}: ${stageData[currentStageIndex].badge.toUpperCase()}`;
    ctx.fillText(stageTitle, roadCenter + 15 * gateScale, archTopY + (topBarH * 0.46));

    ctx.restore();
  }

  function drawBigTree(x, y, scale) {
    if (scale < 0.05) return;
    ctx.save();
    ctx.fillStyle = '#78350f';
    const trunkW = 32 * scale;
    const trunkH = 150 * scale;
    ctx.fillRect(x - trunkW / 2, y - trunkH, trunkW, trunkH);

    ctx.fillStyle = '#14532d';
    ctx.beginPath();
    ctx.arc(x, y - trunkH - 30 * scale, 95 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.arc(x - 30 * scale, y - trunkH - 50 * scale, 75 * scale, 0, Math.PI * 2);
    ctx.arc(x + 30 * scale, y - trunkH - 45 * scale, 70 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(x, y - trunkH - 85 * scale, 55 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTrafficConeBig(x, y, scale, laneWidth) {
    ctx.save();
    const coneW = laneWidth * 0.65;
    const coneH = coneW * 1.35;
    ctx.fillStyle = '#ea580c';
    ctx.beginPath();
    ctx.ellipse(x, y, coneW * 0.5, coneW * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - coneW * 0.38, y);
    ctx.lineTo(x, y - coneH);
    ctx.lineTo(x + coneW * 0.38, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(x - coneW * 0.22, y - coneH * 0.35);
    ctx.lineTo(x, y - coneH * 0.65);
    ctx.lineTo(x + coneW * 0.22, y - coneH * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBarricadeBig(x, y, scale, laneWidth) {
    ctx.save();
    const bw = laneWidth * 0.88;
    const bh = bw * 0.55;
    ctx.fillStyle = '#334155';
    ctx.fillRect(x - bw * 0.45, y - bh, bw * 0.08, bh);
    ctx.fillRect(x + bw * 0.37, y - bh, bw * 0.08, bh);
    ctx.fillStyle = '#ea580c';
    ctx.fillRect(x - bw * 0.5, y - bh * 0.95, bw, bh * 0.45);
    ctx.fillStyle = '#ffffff';
    const stripeGap = bw * 0.16;
    for (let i = -bw * 0.48; i < bw * 0.48; i += stripeGap) {
      ctx.beginPath();
      ctx.moveTo(x + i, y - bh * 0.95);
      ctx.lineTo(x + i + stripeGap * 0.5, y - bh * 0.95);
      ctx.lineTo(x + i, y - bh * 0.5);
      ctx.lineTo(x + i - stripeGap * 0.5, y - bh * 0.5);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBrokenCarBig(x, y, scale, laneWidth) {
    ctx.save();
    const cw = laneWidth * 0.85;
    const ch = cw * 0.68;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x - cw * 0.48, y - ch * 0.25, cw * 0.2, ch * 0.25);
    ctx.fillRect(x + cw * 0.28, y - ch * 0.25, cw * 0.2, ch * 0.25);
    ctx.fillStyle = '#eab308';
    ctx.beginPath();
    ctx.roundRect(x - cw * 0.5, y - ch * 0.88, cw, ch * 0.65, 6 * scale);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.roundRect(x - cw * 0.38, y - ch * 0.8, cw * 0.76, ch * 0.3, 4 * scale);
    ctx.fill();
    if (Math.floor(Date.now() * 0.008) % 2 === 0) {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(x - cw * 0.38, y - ch * 0.42, cw * 0.09, 0, Math.PI * 2);
      ctx.arc(x + cw * 0.38, y - ch * 0.42, cw * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCloud(x, y, scale) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
    ctx.arc(x + 20 * scale, y - 9 * scale, 24 * scale, 0, Math.PI * 2);
    ctx.arc(x + 44 * scale, y, 18 * scale, 0, Math.PI * 2);
    ctx.arc(x + 22 * scale, y + 9 * scale, 18 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // เข้าสู่ Checkpoint และโหลดมินิเกมตามด่าน
  function arriveAtCheckpoint() {
    const stage = stageData[currentStageIndex];
    taskCompleted = false;

    const term = document.getElementById('terminal');
    term.style.display = 'flex';

    document.getElementById('term-title').innerText = `🚧 ${stage.title} (${stage.world})`;
    document.getElementById('term-badge').innerText = `🏅 ${stage.badge}`;
    document.getElementById('term-q').innerText = stage.q;
    document.getElementById('ai-tip').innerHTML = `<strong>Word Co-Pilot:</strong> ลอดซุ้มด่านสำเร็จ! ${stage.hint}`;
    document.getElementById('btn-drive').style.display = 'none';

    renderMinigame(stage);
  }

  // เรนเดอร์มินิเกมจำลองเครื่องมือ Word จริง
  function renderMinigame(stage) {
    const stageBox = document.getElementById('minigame-area');
    stageBox.innerHTML = '';

    // โหมด 1: คีย์ลัดด่วน (Quick-Time Shortcut)
    if (stage.mode === 'shortcut') {
      stageBox.innerHTML = `
        <div style="text-align:center;">
          <p style="color:#64748b; font-size:0.95rem; margin-bottom:8px;">กดปุ่มจริงบนคีย์บอร์ดของคุณ:</p>
          <div class="key-badge" id="shortcut-badge">${stage.displayKey}</div>
          <p id="shortcut-status" style="margin-top:10px; font-weight:600; color:#0284c7;">รอตรวจจับสัญญาณแป้นพิมพ์...</p>
        </div>
      `;
    }

    // โหมด 2: แถบ Ribbon จำลอง (Ribbon Inspector)
    else if (stage.mode === 'ribbon') {
      const tabs = ["ไฟล์ (File)", "หน้าแรก (Home)", "แทรก (Insert)", "เค้าโครง (Layout)"];
      const ribbonDiv = document.createElement('div');
      ribbonDiv.className = 'ribbon-bar';

      tabs.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'ribbon-btn';
        btn.innerText = t;
        btn.onclick = () => {
          if (t.includes(stage.target)) finishTaskSuccess(10);
          else finishTaskFail();
        };
        ribbonDiv.appendChild(btn);
      });
      stageBox.appendChild(ribbonDiv);
    }

    // โหมด 3: ปรับทิศทางเอกสาร (Alignment & Orientation)
    else if (stage.mode === 'align') {
      stageBox.innerHTML = `
        <div class="doc-preview-box" id="preview-paper">
          <div id="sample-text" style="font-size:0.95rem; font-weight:600; color:#0f172a; text-align:left;">หัวข้อรายงาน ม.1</div>
          <div style="height:6px; background:#e2e8f0; width:100%; border-radius:4px; margin-top:6px;"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="ribbon-btn" onclick="applyAlignment('left')">◀ ชิดซ้าย</button>
          <button class="ribbon-btn" style="background:#e0f2fe; border-color:#38bdf8;" onclick="applyAlignment('center')">⬛ กึ่งกลาง</button>
          <button class="ribbon-btn" onclick="applyAlignment('right')">ชิดขวา ▶</button>
        </div>
      `;
    }

    // โหมด 4: ตารางข้อมูล (Table Grid Builder)
    else if (stage.mode === 'table_grid') {
      const grid = document.createElement('div');
      grid.className = 'table-picker';
      for (let r = 1; r <= 3; r++) {
        for (let c = 1; c <= 4; c++) {
          const cell = document.createElement('div');
          cell.className = 'table-cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.onmouseover = () => highlightGrid(c, r);
          cell.onclick = () => {
            if (c === stage.targetCols && r === stage.targetRows) finishTaskSuccess(10);
            else finishTaskFail();
          };
          grid.appendChild(cell);
        }
      }
      stageBox.innerHTML = `<div style="font-size:0.9rem; color:#64748b; margin-bottom:4px;">ลากเมาส์คลิกขนาด 3 x 2:</div>`;
      stageBox.appendChild(grid);
    }

    // โหมดทั่วไปอื่นๆ: ตัวเลือกแบบไอคอนน่ารัก
    else {
      const defaultDiv = document.createElement('div');
      defaultDiv.style.display = 'flex';
      defaultDiv.style.gap = '10px';
      defaultDiv.style.flexWrap = 'wrap';
      defaultDiv.style.justifyContent = 'center';

      stage.opts = stage.opts || ["Square", "Behind Text", "In Front of Text"];
      stage.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'ribbon-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (opt.includes(stage.target)) finishTaskSuccess(10);
          else finishTaskFail();
        };
        defaultDiv.appendChild(btn);
      });
      stageBox.appendChild(defaultDiv);
    }
  }

  // ดักจับคีย์บอร์ดสำหรับโหมด Shortcut
  function handleMinigameKeyboard(e) {
    const stage = stageData[currentStageIndex];
    if (stage.mode !== 'shortcut') return;

    if (e.ctrlKey && e.key.toLowerCase() === stage.keyReq) {
      e.preventDefault();
      document.getElementById('shortcut-badge').style.background = '#dcfce7';
      document.getElementById('shortcut-badge').style.borderColor = '#22c55e';
      document.getElementById('shortcut-status').innerText = '🎉 ทำคีย์ลัดสำเร็จ!';
      document.getElementById('shortcut-status').style.color = '#15803d';
      finishTaskSuccess(10);
    }
  }

  function applyAlignment(type) {
    document.getElementById('sample-text').style.textAlign = type;
    if (type === 'center') {
      setTimeout(() => finishTaskSuccess(10), 300);
    } else {
      finishTaskFail();
    }
  }

  function highlightGrid(cols, rows) {
    document.querySelectorAll('.table-cell').forEach(cell => {
      const c = parseInt(cell.dataset.c);
      const r = parseInt(cell.dataset.r);
      if (c <= cols && r <= rows) cell.classList.add('selected');
      else cell.classList.remove('selected');
    });
  }

  function finishTaskSuccess(scoreGained) {
    if (taskCompleted) return;
    taskCompleted = true;

    totalScoreE1 += scoreGained;
    totalStars += 3;

    document.getElementById('ai-tip').innerHTML = `
      <strong style="color:#15803d">Word Co-Pilot:</strong> เยี่ยมมาก! ปฏิบัติภารกิจถูกต้อง 🎉 (+${scoreGained} แต้ม E1 | 3 ⭐)
    `;

    updateHUD();
    document.getElementById('btn-drive').style.display = 'inline-block';
  }

  function finishTaskFail() {
    shields--;
    updateHUD();
    document.getElementById('ai-tip').innerHTML = `
      <strong style="color:#b91c1c">Word Co-Pilot:</strong> เครื่องมือยังไม่ตรงกับโจทย์นะ เกราะลด 1 หน่วย! คำใบ้: ${stageData[currentStageIndex].hint}
    `;
    if (shields <= 0) {
      alert("🚨 เกราะหมด! เข้าสู่สถานีซ่อมบำรุงฉุกเฉิน (ฟื้นฟู 2 หน่วย)");
      shields = 2;
      updateHUD();
    }
  }

  function continueDriving() {
    document.getElementById('terminal').style.display = 'none';
    currentStageIndex++;
    window.focus();

    if (currentStageIndex < 12) {
      distanceToNextGate = 1000;
      isArrivedAtGate = false;
      obstacles = [];
      spawnObstacleWave(0.1);
      updateHUD();
    } else {
      alert(`🏆 ยินดีด้วย! คุณพิชิตครบทั้ง 4 Worlds 12 Checkpoints สำเร็จแล้ว!\nคะแนนรวม E1: ${totalScoreE1}/120 (${Math.round((totalScoreE1/120)*100)}%)\nพร้อมก้าวสู่เกม E2 (Word Jump) ต่อไป!`);
    }
  }

  window.onload = init;
</script>

</body>
</html>
