<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🚗 Word Road: Fair Hitbox & Full Shield Repair (E1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --word-blue: #0078d4;
      --sky-blue: #38bdf8;
      --grass-green: #22c55e;
      --sunny-gold: #facc15;
      --danger-red: #ef4444;
      --cockpit-frame: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: #0f172a;
      color: #334155;
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-top {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-family: 'Chakra Petch', sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      color: #fff;
      font-size: 0.9rem;
      gap: 6px;
    }
    .hud-val { color: #38bdf8; font-weight: bold; font-size: 1rem; }

    .cockpit-viewport {
      position: relative;
      width: 100%;
      height: 70vh;
      max-height: 560px;
      min-height: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 4px solid var(--cockpit-frame);
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      background: #87ceeb;
      touch-action: none;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .cockpit-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .windshield-frame {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.3), 
                  inset 18px 0 25px rgba(15,23,42,0.8), 
                  inset -18px 0 25px rgba(15,23,42,0.8);
      border-top: 10px solid #1e293b;
    }

    .dashboard {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      border-top: 3px solid #475569;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.5);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px 10px 20px;
      clip-path: polygon(0 20%, 25% 0, 75% 0, 100% 20%, 100% 100%, 0 100%);
    }

    .steering-wheel-container {
      position: absolute;
      left: 50%;
      bottom: -60px;
      transform: translateX(-50%);
      width: 190px;
      height: 190px;
      transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    .wheel-ring {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 16px solid #0f172a;
      border-top-color: #475569;
      box-shadow: inset 0 0 8px #000, 0 6px 14px rgba(0,0,0,0.6);
      position: relative;
    }
    .wheel-hub {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 50px; height: 50px;
      background: #1e293b;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch';
      font-weight: 700;
      color: #38bdf8;
      font-size: 0.8rem;
    }
    .wheel-spoke { position: absolute; background: #0f172a; }
    .spoke-h { top: 50%; left: 0; right: 0; height: 12px; transform: translateY(-50%); }
    .spoke-v { bottom: 0; left: 50%; width: 12px; height: 50%; transform: translateX(-50%); }

    .gauge { font-family: 'Chakra Petch', sans-serif; text-align: center; z-index: 5; }
    .gauge-num { font-size: 1.6rem; font-weight: 700; color: #38bdf8; }
    .gauge-label { font-size: 0.65rem; color: #94a3b8; }

    .pedals {
      position: absolute;
      bottom: 10px; left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 20;
    }
    .pedal-btn {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #38bdf8;
      color: #fff;
      font-family: 'Kanit';
      font-weight: 500;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .pedal-btn:active { background: #38bdf8; color: #000; }

    .crash-flash {
      position: absolute;
      inset: 0;
      background: rgba(239, 68, 68, 0.45);
      display: none;
      pointer-events: none;
      z-index: 50;
    }

    .mission-terminal {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
      background: #ffffff;
      border: 3px solid #38bdf8;
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 16px 40px rgba(0, 120, 212, 0.25);
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
      pointer-events: auto;
    }

    .terminal-title {
      font-family: 'Kanit';
      font-weight: 600;
      font-size: 1.15rem;
      color: #0284c7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 8px;
    }

    .badge-tag {
      background: #fef08a;
      color: #854d0e;
      border: 2px solid #facc15;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .terminal-q {
      font-size: 1.05rem;
      line-height: 1.5;
      color: #1e293b;
      font-weight: 500;
    }

    .minigame-stage {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 130px;
      gap: 10px;
    }

    .ai-co-pilot {
      background: #fefce8;
      border: 2px solid #fef08a;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #713f12;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-drive-on {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border: none;
      color: #fff;
      font-family: 'Kanit';
      font-weight: 600;
      font-size: 1rem;
      padding: 10px 24px;
      border-radius: 12px;
      cursor: pointer;
      align-self: flex-end;
      box-shadow: 0 4px 0 #0369a1;
      display: none;
    }

    .key-badge-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 3px solid #0284c7;
      border-radius: 12px;
      padding: 12px 28px;
      font-family: 'Chakra Petch';
      font-weight: 700;
      font-size: 1.4rem;
      color: #0284c7;
      box-shadow: 0 5px 0 #bae6fd;
      cursor: pointer;
    }
    .key-badge-btn:active { transform: translateY(3px); box-shadow: none; }

    .ribbon-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .ribbon-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background: #fff;
      font-family: 'Kanit';
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .ribbon-btn:active { background: #e0f2fe; border-color: #38bdf8; }

    .doc-preview-box {
      width: 180px;
      height: 75px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .table-picker {
      display: grid;
      grid-template-columns: repeat(4, 36px);
      grid-template-rows: repeat(3, 36px);
      gap: 6px;
    }
    .table-cell {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
    }
    .table-cell.selected { background: #38bdf8; border-color: #0284c7; }

    /* หน้าต่างซ่อมแซมรถฉุกเฉิน */
    .repair-modal {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }
    .repair-card {
      background: #ffffff;
      border: 4px solid #f87171;
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .repair-opt-btn {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      color: #1e293b;
      padding: 12px 16px;
      border-radius: 12px;
      font-family: 'Kanit';
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .repair-opt-btn:active { background: #e0f2fe; border-color: #38bdf8; }
  </style>
</head>
<body>

<div class="main-wrapper">

  <div class="hud-top">
    <div>🛡️ <span id="health-val" class="hud-val">❤️❤️❤️</span></div>
    <div>🚩 <span id="cp-track-val" class="hud-val">ด่าน 1/12</span></div>
    <div>⭐ <span id="star-val" class="hud-val">0</span></div>
    <div>📊 E1: <span id="e1-val" class="hud-val" style="color:#4ade80">0%</span></div>
  </div>

  <div class="cockpit-viewport" id="viewport">
    <canvas id="roadCanvas" width="960" height="560"></canvas>
    <div class="crash-flash" id="crash-flash"></div>

    <div class="cockpit-overlay">
      <div class="windshield-frame"></div>

      <div class="dashboard">
        <div class="gauge">
          <div class="gauge-num" id="speed-num">0</div>
          <div class="gauge-label">KM/H</div>
        </div>

        <div class="gauge">
          <div class="gauge-num" id="dist-num" style="color:var(--sunny-gold)">1000</div>
          <div class="gauge-label">DIST (M)</div>
        </div>
      </div>

      <div class="steering-wheel-container" id="wheel">
        <div class="wheel-ring">
          <div class="wheel-spoke spoke-h"></div>
          <div class="wheel-spoke spoke-v"></div>
          <div class="wheel-hub">WORD</div>
        </div>
      </div>

      <div class="pedals">
        <div style="display:flex; gap:6px;">
          <button class="pedal-btn" id="btn-left">◀ ซ้าย</button>
          <button class="pedal-btn" id="btn-right">ขวา ▶</button>
        </div>
        <button class="pedal-btn" id="btn-gas" style="background:#0284c7; border-color:#38bdf8; padding: 12px 24px;">⚡ เร่งเครื่อง</button>
      </div>
    </div>

    <!-- Terminal -->
    <div class="mission-terminal" id="terminal">
      <div class="terminal-title">
        <span id="term-title">🚧 CHECKPOINT 1</span>
        <span class="badge-tag" id="term-badge">🏅 Word Badge</span>
      </div>

      <div class="terminal-q" id="term-q">ภารกิจปฏิบัติการ...</div>

      <div class="minigame-stage" id="minigame-area"></div>

      <div class="ai-co-pilot">
        <div style="font-size:1.4rem;">🤖</div>
        <div id="ai-tip"><strong>Word Co-Pilot:</strong> ลงมือทำภารกิจเพื่อไปต่อ</div>
      </div>

      <button id="btn-drive" class="btn-drive-on" onclick="continueDriving()">ผ่านด่าน! ลุยต่อ ➔</button>
    </div>

  </div>

</div>

<!-- Repair Mission Modal (กู้ภัยเติม 3 เกราะเต็ม) -->
<div class="repair-modal" id="repair-modal">
  <div class="repair-card">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:1.6rem;">🔧</span>
      <h3 style="color:#ef4444; font-family:'Kanit';">สถานีซ่อมแซมฉุกเฉิน (กู้คืนเกราะเต็ม 3 ดวง)</h3>
    </div>
    <p id="repair-desc" style="color:#64748b; font-size:0.92rem; line-height:1.5;"></p>
    <div style="background:#f8fafc; border:2px dashed #cbd5e1; padding:14px; border-radius:14px; display:flex; flex-direction:column; gap:10px;">
      <strong id="repair-q" style="color:#0284c7; font-size:1rem;">คำถามฟื้นฟูเกราะ...</strong>
      <div id="repair-opts" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
</div>

<script>
  const stageData = [

    { id: 9, world: "World 3", title: "Checkpoint 9: กระดาษแนวนอน", badge: "Layout Pilot", mode: "orientation", q: "ภารกิจ: ปรับเปลี่ยนการวางกระดาษเป็น 'แนวนอน (Landscape)':", target: "landscape", hint: "Landscape คือกระดาษแนวนอน ส่วน Portrait คือแนวตั้ง", rq: "Landscape หมายถึงการวางแนวกระดาษแบบใด?", ro: ["แนวนอน", "แนวตั้ง", "แนวเฉียง"], ra: 0 },

    { id: 11, world: "World 4", title: "Checkpoint 11: สารบัญอัตโนมัติ", badge: "Style Maestro", mode: "styles", q: "ภารกิจ: แตะเลือกสไตล์ที่ใช้ทำหัวข้อหลักสำหรับสารบัญ:", target: "Heading 1", hint: "Heading 1 ใช้สำหรับกำหนดหัวข้อหลักของรายงาน", rq: "สไตล์ใดนิยมนำมาใช้ตั้งเป็นหัวข้อหลักเพื่อทำสารบัญ?", ro: ["Heading 1", "Normal", "Title"], ra: 0 },
    { id: 12, world: "World 4", title: "Checkpoint 12: ส่งออกพิมพ์งาน", badge: "Word Grand Master", mode: "export_pdf", q: "ภารกิจ: ส่งงานไปพิมพ์โดยไม่ให้ฟอนต์เพี้ยน แตะเลือกชนิดไฟล์:", target: ".pdf", hint: "ไฟล์ PDF ล็อคหน้ากระดาษและฟอนต์ไม่ให้เพี้ยน 100%", rq: "ไฟล์ชนิดใดคงรูปแบบหน้ากระดาษและฟอนต์ได้ดีที่สุด?", ro: [".pdf", ".txt", ".rtf"], ra: 0 }
  ];

  const worldThemes = [
    { skyTop: "#38bdf8", skyBottom: "#e0f2fe", grass: "#16a34a", mountain: "#4ade80", road: "#334155" },
    { skyTop: "#f97316", skyBottom: "#ffedd5", grass: "#b45309", mountain: "#ea580c", road: "#292524" },
    { skyTop: "#0ea5e9", skyBottom: "#e0f2fe", grass: "#059669", mountain: "#34d399", road: "#1e293b" },
    { skyTop: "#1e1b4b", skyBottom: "#312e81", grass: "#0f172a", mountain: "#4338ca", road: "#020617" }
  ];

  let currentStageIndex = 0;
  let shields = 3;
  let totalScoreE1 = 0;
  let totalStars = 0;
  let taskCompleted = false;

  let speed = 0;
  let maxSpeed = 160;
  let roadPosition = 0;
  let distanceToNextGate = 1000;
  let isArrivedAtGate = false;
  let steeringAngle = 0;

  const laneOffsets = [-1.0, 0.0, 1.0];
  let currentLane = 1;
  let targetX = 0.0;
  let currentX = 0.0;

  let obstacles = [];

  function spawnObstacleWave(startZ) {
    const types = ['cone', 'barrier', 'broken_car'];
    const safeLane = Math.floor(Math.random() * 3);
    const blockedLanes = [0, 1, 2].filter(l => l !== safeLane);
    const count = Math.random() < 0.4 ? 1 : 2;
    const finalLanes = blockedLanes.sort(() => Math.random() - 0.5).slice(0, count);

    finalLanes.forEach(laneIdx => {
      obstacles.push({
        z: startZ,
        lane: laneIdx,
        type: types[Math.floor(Math.random() * types.length)],
        hit: false
      });
    });
  }

  let roadsideItems = [];
  for (let i = 0; i < 12; i++) {
    roadsideItems.push({ z: (i / 12), side: i % 2 === 0 ? -1 : 1, type: 'tree' });
  }

  let clouds = [
    { x: 50, y: 50, scale: 1.2 },
    { x: 300, y: 30, scale: 0.8 },
    { x: 600, y: 65, scale: 1.0 },
    { x: 820, y: 40, scale: 1.4 }
  ];

  let isGasPressed = false;
  const canvas = document.getElementById('roadCanvas');
  const ctx = canvas.getContext('2d');
  const wheelEl = document.getElementById('wheel');
  const viewportEl = document.getElementById('viewport');

  function init() {
    bindControls();
    updateHUD();
    obstacles = [];
    spawnObstacleWave(0.1);
    requestAnimationFrame(gameLoop);
  }

  function changeLane(direction) {
    if (isArrivedAtGate) return;
    if (direction === -1 && currentLane > 0) {
      currentLane--;
      steeringAngle = -35;
    } else if (direction === 1 && currentLane < 2) {
      currentLane++;
      steeringAngle = 35;
    }
    targetX = laneOffsets[currentLane];
  }

  let touchStartX = 0;
  let touchStartY = 0;

  function bindControls() {
    viewportEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    viewportEl.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 35) {
        if (diffX > 0) changeLane(1);
        else changeLane(-1);
      }
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (isArrivedAtGate && !taskCompleted) {
        handleMinigameKeyboard(e);
        return;
      }
      const key = e.key.toLowerCase();
      const code = e.code;
      if (code === 'KeyW' || key === 'w' || code === 'ArrowUp' || key === 'arrowup') isGasPressed = true;
      if (code === 'KeyA' || key === 'a' || code === 'ArrowLeft' || key === 'arrowleft') changeLane(-1);
      if (code === 'KeyD' || key === 'd' || code === 'ArrowRight' || key === 'arrowright') changeLane(1);
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      const code = e.code;
      if (code === 'KeyW' || key === 'w' || code === 'ArrowUp' || key === 'arrowup') isGasPressed = false;
    });

    document.getElementById('btn-left').onclick = (e) => { e.preventDefault(); changeLane(-1); };
    document.getElementById('btn-right').onclick = (e) => { e.preventDefault(); changeLane(1); };

    const gasBtn = document.getElementById('btn-gas');
    const startGas = (e) => { e.preventDefault(); if (!isArrivedAtGate) isGasPressed = true; };
    const endGas = (e) => { e.preventDefault(); isGasPressed = false; };
    gasBtn.onmousedown = startGas;
    gasBtn.onmouseup = endGas;
    gasBtn.ontouchstart = startGas;
    gasBtn.ontouchend = endGas;
  }

  function updateHUD() {
    let hearts = "";
    for(let i=0; i<3; i++) hearts += (i < shields) ? "❤️" : "🖤";
    document.getElementById('health-val').innerText = hearts;

    const currentWorldIndex = Math.floor(currentStageIndex / 3);
    document.getElementById('cp-track-val').innerText = `W${currentWorldIndex + 1}: ด่าน ${currentStageIndex + 1}/12`;
    document.getElementById('star-val').innerText = totalStars;

    const pct = Math.round((totalScoreE1 / 120) * 100);
    document.getElementById('e1-val').innerText = `${pct}%`;
  }

  function triggerCrash() {
    speed = Math.max(15, speed * 0.2);
    shields--;
    updateHUD();

    const flash = document.getElementById('crash-flash');
    flash.style.display = 'block';
    setTimeout(() => { flash.style.display = 'none'; }, 250);

    if (shields <= 0) {
      showRepairModal();
    }
  }

  // หน้าต่างซ่อมแซมรถฉุกเฉิน กู้คืนเกราะเต็ม 3 ดวง
  function showRepairModal() {
    const stage = stageData[currentStageIndex];
    const modal = document.getElementById('repair-modal');
    document.getElementById('repair-desc').innerText = `ระบบตรวจพบว่าเกราะรถหมดลง สรุปแนวคิดเรื่อง "${stage.topic}": ${stage.hint}`;
    document.getElementById('repair-q').innerText = stage.rq;

    const box = document.getElementById('repair-opts');
    box.innerHTML = '';
    stage.ro.forEach((txt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'repair-opt-btn';
      btn.innerText = `${idx + 1}. ${txt}`;
      btn.onclick = () => {
        if (idx === stage.ra) {
          alert('🔧 ซ่อมแซมระบบสำเร็จ! ฟื้นฟูเกราะรถเต็ม 3 ดวง ❤️❤️❤️');
          shields = 3;
          modal.style.display = 'none';
          updateHUD();
          window.focus();
        } else {
          alert('ยังไม่ถูกต้องนะ ลองอ่านทบทวนใหม่อีกครั้ง');
        }
      };
      box.appendChild(btn);
    });

    modal.style.display = 'flex';
  }

  function gameLoop() {
    if (!isArrivedAtGate) {
      if (isGasPressed) speed = Math.min(speed + 2.2, maxSpeed);
      else speed = Math.max(speed - 1.2, 0);

      currentX += (targetX - currentX) * 0.22;
      steeringAngle *= 0.82;
      wheelEl.style.transform = `translateX(-50%) rotate(${steeringAngle}deg)`;

      roadPosition += speed;
      distanceToNextGate -= (speed * 0.04);

      clouds.forEach(c => {
        c.x += 0.15;
        if (c.x > canvas.width + 120) c.x = -120;
      });

      roadsideItems.forEach(item => {
        item.z += (speed * 0.00015);
        if (item.z >= 1) item.z -= 1;
      });

      // ตรวจสอบการชน: ปรับ Hitbox ให้แม่นยำและไม่ชนมั่ว
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.z += (speed * 0.00016);

        // ตรวจจับเฉพาะจังหวะที่วัตถุอยู่ประชิดจริงๆ (z: 0.78 ถึง 0.90)
        // และรถต้องอยู่ใกล้กึ่งกลางเลนนั้นจริง (ระยะห่าง < 0.18 ไม่จับกินขอบเลน)
        if (!obs.hit && obs.z > 0.78 && obs.z < 0.90) {
          const laneCenter = laneOffsets[obs.lane];
          if (speed > 5 && Math.abs(currentX - laneCenter) < 0.18) {
            obs.hit = true;
            triggerCrash();
          }
        }

        if (obs.z >= 1.05) obstacles.splice(i, 1);
      }

      const closestObstacleZ = obstacles.reduce((min, o) => Math.min(min, o.z), 1.0);
      if (closestObstacleZ > 0.65 && distanceToNextGate > 350) {
        spawnObstacleWave(0.04);
      }

      if (distanceToNextGate <= 0) {
        distanceToNextGate = 0;
        speed = 0;
        isArrivedAtGate = true;
        arriveAtCheckpoint();
      }

      document.getElementById('speed-num').innerText = Math.round(speed);
      document.getElementById('dist-num').innerText = Math.round(distanceToNextGate);
    }

    render3DScene();
    requestAnimationFrame(gameLoop);
  }

  function render3DScene() {
    const w = canvas.width;
    const h = canvas.height;
    const horizon = h * 0.44;

    const worldIndex = Math.floor(currentStageIndex / 3);
    const theme = worldThemes[worldIndex];

    ctx.clearRect(0, 0, w, h);

    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
    skyGrad.addColorStop(0, theme.skyTop);
    skyGrad.addColorStop(1, theme.skyBottom);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, horizon);

    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(820, 65, 34, 0, Math.PI * 2);
    ctx.fill();

    clouds.forEach(c => drawCloud(c.x, c.y, c.scale));

    ctx.fillStyle = theme.mountain;
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    ctx.quadraticCurveTo(200, horizon - 35, 450, horizon);
    ctx.quadraticCurveTo(700, horizon - 45, w, horizon);
    ctx.fill();

    ctx.fillStyle = theme.grass;
    ctx.fillRect(0, horizon, w, h - horizon);

    const roadW_near = w * 1.1;
    const roadW_far = w * 0.16;
    const x_near = (w / 2) - (currentX * (roadW_near * 0.33));
    const x_far = (w / 2) - (currentX * (roadW_far * 0.33) * 0.8);

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.moveTo(x_far - roadW_far * 0.54, horizon);
    ctx.lineTo(x_near - roadW_near * 0.54, h);
    ctx.lineTo(x_near + roadW_near * 0.54, h);
    ctx.lineTo(x_far + roadW_far * 0.54, horizon);
    ctx.fill();

    ctx.fillStyle = theme.road;
    ctx.beginPath();
    ctx.moveTo(x_far - roadW_far * 0.5, horizon);
    ctx.lineTo(x_near - roadW_near * 0.5, h);
    ctx.lineTo(x_near + roadW_near * 0.5, h);
    ctx.lineTo(x_far + roadW_far * 0.5, horizon);
    ctx.fill();

    const segments = 40;
    for (let i = 0; i < segments; i++) {
      const isStripe = Math.floor((roadPosition * 0.08 - i)) % 2 === 0;
      if (!isStripe) continue;

      const z1 = i / segments;
      const z2 = (i + 1) / segments;

      const y1 = horizon + Math.pow(z1, 2.6) * (h - horizon);
      const y2 = horizon + Math.pow(z2, 2.6) * (h - horizon);

      const rW1 = roadW_far + (roadW_near - roadW_far) * Math.pow(z1, 2.6);
      const rW2 = roadW_far + (roadW_near - roadW_far) * Math.pow(z2, 2.6);

      const rx1 = (w / 2) - (currentX * (rW1 * 0.33));
      const rx2 = (w / 2) - (currentX * (rW2 * 0.33));

      const laneW1 = rW1 / 3;
      const laneW2 = rW2 / 3;
      const lineW1 = rW1 * 0.016;
      const lineW2 = rW2 * 0.016;

      ctx.fillStyle = '#ffffff';
      const l1_x1 = rx1 - (laneW1 * 0.5);
      const l1_x2 = rx2 - (laneW2 * 0.5);
      ctx.beginPath();
      ctx.moveTo(l1_x1 - lineW1, y1); ctx.lineTo(l1_x2 - lineW2, y2);
      ctx.lineTo(l1_x2 + lineW2, y2); ctx.lineTo(l1_x1 + lineW1, y1);
      ctx.fill();

      const l2_x1 = rx1 + (laneW1 * 0.5);
      const l2_x2 = rx2 + (laneW2 * 0.5);
      ctx.beginPath();
      ctx.moveTo(l2_x1 - lineW1, y1); ctx.lineTo(l2_x2 - lineW2, y2);
      ctx.lineTo(l2_x2 + lineW2, y2); ctx.lineTo(l2_x1 + lineW1, y1);
      ctx.fill();
    }

    let sortedItems = [...roadsideItems].sort((a, b) => a.z - b.z);
    sortedItems.forEach(item => {
      const z = item.z;
      const y = horizon + Math.pow(z, 2.6) * (h - horizon);
      const roadW = roadW_far + (roadW_near - roadW_far) * Math.pow(z, 2.6);
      const roadCenterX = (w / 2) - (currentX * (roadW * 0.33));
      const scale = Math.pow(z, 2.0);
      const itemX = roadCenterX + (item.side * (roadW * 0.56 + scale * 160));
      drawBigTree(itemX, y, scale);
    });

    let sortedObstacles = [...obstacles].sort((a, b) => a.z - b.z);
    sortedObstacles.forEach(obs => {
      const z = obs.z;
      if (z <= 0.02 || z >= 1.02) return;

      const y = horizon + Math.pow(z, 2.6) * (h - horizon);
      const roadW = roadW_far + (roadW_near - roadW_far) * Math.pow(z, 2.6);
      const roadCenterX = (w / 2) - (currentX * (roadW * 0.33));
      const scale = Math.pow(z, 2.0);
      const laneWidth = (roadW / 3);

      const laneOffset = laneOffsets[obs.lane] * laneWidth;
      const obsX = roadCenterX + laneOffset;

      if (obs.type === 'cone') drawTrafficConeBig(obsX, y, scale, laneWidth);
      else if (obs.type === 'barrier') drawBarricadeBig(obsX, y, scale, laneWidth);
      else if (obs.type === 'broken_car') drawBrokenCarBig(obsX, y, scale, laneWidth);
    });

    if (distanceToNextGate < 450) {
      const gateProgress = (1 - (distanceToNextGate / 450));
      const gateScale = Math.pow(gateProgress, 2.1);
      drawGrandArchway(gateScale, gateProgress);
    }
  }

  function drawGrandArchway(gateScale, gateProgress) {
    if (gateScale < 0.04) return;
    const w = canvas.width;
    const h = canvas.height;
    const horizon = h * 0.44;

    const roadW_near = w * 1.1;
    const roadW_far = w * 0.16;
    const currentRoadW = roadW_far + (roadW_near - roadW_far) * gateScale;
    const roadCenter = (w / 2) - (currentX * (currentRoadW * 0.33));

    const groundY = horizon + gateScale * (h - horizon - 30);
    const archW = currentRoadW * 1.24;
    const archH = 220 * gateScale;
    const topBarH = 55 * gateScale;
    const archTopY = groundY - archH;

    const leftX = roadCenter - (archW / 2);
    const rightX = roadCenter + (archW / 2);
    const postW = 28 * gateScale;

    ctx.save();
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(leftX - postW * 0.3, groundY - 12 * gateScale, postW * 1.6, 14 * gateScale, 3 * gateScale);
    ctx.roundRect(rightX - postW * 1.3, groundY - 12 * gateScale, postW * 1.6, 14 * gateScale, 3 * gateScale);
    ctx.fill();

    const pillarGrad = ctx.createLinearGradient(leftX, 0, leftX + postW, 0);
    pillarGrad.addColorStop(0, '#0284c7');
    pillarGrad.addColorStop(0.5, '#38bdf8');
    pillarGrad.addColorStop(1, '#0369a1');

    ctx.fillStyle = pillarGrad;
    ctx.fillRect(leftX, archTopY + topBarH * 0.8, postW, archH - topBarH * 0.8);
    ctx.fillRect(rightX - postW, archTopY + topBarH * 0.8, postW, archH - topBarH * 0.8);

    ctx.fillStyle = '#facc15';
    ctx.fillRect(leftX + postW * 0.35, archTopY + topBarH, postW * 0.3, archH - topBarH - 12 * gateScale);
    ctx.fillRect(rightX - postW * 0.65, archTopY + topBarH, postW * 0.3, archH - topBarH - 12 * gateScale);

    const signLeft = leftX - 10 * gateScale;
    const signW = archW + 20 * gateScale;

    const signGrad = ctx.createLinearGradient(0, archTopY, 0, archTopY + topBarH);
    signGrad.addColorStop(0, '#0078d4');
    signGrad.addColorStop(0.5, '#106ebe');
    signGrad.addColorStop(1, '#004578');

    ctx.fillStyle = signGrad;
    ctx.beginPath();
    ctx.roundRect(signLeft, archTopY, signW, topBarH, 8 * gateScale);
    ctx.fill();

    ctx.fillStyle = '#facc15';
    ctx.fillRect(signLeft, archTopY, signW, 4 * gateScale);
    ctx.fillRect(signLeft, archTopY + topBarH - 4 * gateScale, signW, 4 * gateScale);

    const checkH = 14 * gateScale;
    const checkY = archTopY + topBarH;
    const checkSize = 14 * gateScale;
    const numChecks = Math.ceil(signW / checkSize);
    for (let c = 0; c < numChecks; c++) {
      ctx.fillStyle = (c % 2 === 0) ? '#0f172a' : '#ffffff';
      ctx.fillRect(signLeft + (c * checkSize), checkY, checkSize, checkH);
    }

    const badgeR = 24 * gateScale;
    const badgeX = signLeft + 35 * gateScale;
    const badgeY = archTopY + topBarH / 2;

    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#0f172a';
    ctx.font = `bold ${Math.max(10, 18 * gateScale)}px 'Chakra Petch'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${currentStageIndex + 1}`, badgeX, badgeY);

    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.max(10, 19 * gateScale)}px 'Chakra Petch'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const stageTitle = `CHECKPOINT ${currentStageIndex + 1}: ${stageData[currentStageIndex].badge.toUpperCase()}`;
    ctx.fillText(stageTitle, roadCenter + 15 * gateScale, archTopY + (topBarH * 0.46));
    ctx.restore();
  }

  function drawBigTree(x, y, scale) {
    if (scale < 0.05) return;
    ctx.save();
    ctx.fillStyle = '#78350f';
    const trunkW = 32 * scale;
    const trunkH = 150 * scale;
    ctx.fillRect(x - trunkW / 2, y - trunkH, trunkW, trunkH);

    ctx.fillStyle = '#14532d';
    ctx.beginPath();
    ctx.arc(x, y - trunkH - 30 * scale, 95 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.arc(x - 30 * scale, y - trunkH - 50 * scale, 75 * scale, 0, Math.PI * 2);
    ctx.arc(x + 30 * scale, y - trunkH - 45 * scale, 70 * scale, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.arc(x, y - trunkH - 85 * scale, 55 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTrafficConeBig(x, y, scale, laneWidth) {
    ctx.save();
    const coneW = laneWidth * 0.65;
    const coneH = coneW * 1.35;
    ctx.fillStyle = '#ea580c';
    ctx.beginPath();
    ctx.ellipse(x, y, coneW * 0.5, coneW * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - coneW * 0.38, y);
    ctx.lineTo(x, y - coneH);
    ctx.lineTo(x + coneW * 0.38, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(x - coneW * 0.22, y - coneH * 0.35);
    ctx.lineTo(x, y - coneH * 0.65);
    ctx.lineTo(x + coneW * 0.22, y - coneH * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBarricadeBig(x, y, scale, laneWidth) {
    ctx.save();
    const bw = laneWidth * 0.88;
    const bh = bw * 0.55;
    ctx.fillStyle = '#334155';
    ctx.fillRect(x - bw * 0.45, y - bh, bw * 0.08, bh);
    ctx.fillRect(x + bw * 0.37, y - bh, bw * 0.08, bh);
    ctx.fillStyle = '#ea580c';
    ctx.fillRect(x - bw * 0.5, y - bh * 0.95, bw, bh * 0.45);
    ctx.fillStyle = '#ffffff';
    const stripeGap = bw * 0.16;
    for (let i = -bw * 0.48; i < bw * 0.48; i += stripeGap) {
      ctx.beginPath();
      ctx.moveTo(x + i, y - bh * 0.95);
      ctx.lineTo(x + i + stripeGap * 0.5, y - bh * 0.95);
      ctx.lineTo(x + i, y - bh * 0.5);
      ctx.lineTo(x + i - stripeGap * 0.5, y - bh * 0.5);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBrokenCarBig(x, y, scale, laneWidth) {
    ctx.save();
    const cw = laneWidth * 0.85;
    const ch = cw * 0.68;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x - cw * 0.48, y - ch * 0.25, cw * 0.2, ch * 0.25);
    ctx.fillRect(x + cw * 0.28, y - ch * 0.25, cw * 0.2, ch * 0.25);
    ctx.fillStyle = '#eab308';
    ctx.beginPath();
    ctx.roundRect(x - cw * 0.5, y - ch * 0.88, cw, ch * 0.65, 6 * scale);
    ctx.fill();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.roundRect(x - cw * 0.38, y - ch * 0.8, cw * 0.76, ch * 0.3, 4 * scale);
    ctx.fill();
    if (Math.floor(Date.now() * 0.008) % 2 === 0) {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(x - cw * 0.38, y - ch * 0.42, cw * 0.09, 0, Math.PI * 2);
      ctx.arc(x + cw * 0.38, y - ch * 0.42, cw * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCloud(x, y, scale) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
    ctx.arc(x + 20 * scale, y - 9 * scale, 24 * scale, 0, Math.PI * 2);
    ctx.arc(x + 44 * scale, y, 18 * scale, 0, Math.PI * 2);
    ctx.arc(x + 22 * scale, y + 9 * scale, 18 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function arriveAtCheckpoint() {
    const stage = stageData[currentStageIndex];
    taskCompleted = false;

    const term = document.getElementById('terminal');
    term.style.display = 'flex';

    document.getElementById('term-title').innerText = `🚧 ${stage.title} (${stage.world})`;
    document.getElementById('term-badge').innerText = `🏅 ${stage.badge}`;
    document.getElementById('term-q').innerText = stage.q;
    document.getElementById('ai-tip').innerHTML = `<strong>Word Co-Pilot:</strong> ${stage.hint}`;
    document.getElementById('btn-drive').style.display = 'none';

    renderMinigame(stage);
  }

  function renderMinigame(stage) {
    const stageBox = document.getElementById('minigame-area');
    stageBox.innerHTML = '';

    if (stage.mode === 'shortcut') {
      stageBox.innerHTML = `
        <div style="text-align:center;">
          <p style="color:#64748b; font-size:0.9rem; margin-bottom:8px;">แตะปุ่มนี้เพื่อใช้งานคำสั่งด่วน:</p>
          <button class="key-badge-btn" id="shortcut-badge" onclick="triggerShortcutSuccess()">${stage.displayKey}</button>
          <p id="shortcut-status" style="margin-top:10px; font-weight:600; color:#0284c7; font-size:0.9rem;">👉 แตะปุ่ม [ ${stage.displayKey} ] เลยจ้า</p>
        </div>
      `;
    }
    else if (stage.mode === 'ribbon') {
      const tabs = ["ไฟล์ (File)", "หน้าแรก (Home)", "แทรก (Insert)", "เค้าโครง (Layout)"];
      const ribbonDiv = document.createElement('div');
      ribbonDiv.className = 'ribbon-bar';
      tabs.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'ribbon-btn';
        btn.innerText = t;
        btn.onclick = () => {
          if (t.includes(stage.target)) finishTaskSuccess(10);
          else finishTaskFail();
        };
        ribbonDiv.appendChild(btn);
      });
      stageBox.appendChild(ribbonDiv);
    }
    else if (stage.mode === 'align') {
      stageBox.innerHTML = `
        <div class="doc-preview-box">
          <div id="sample-text" style="font-size:0.9rem; font-weight:600; color:#0f172a; text-align:left;">หัวข้อรายงาน ม.1</div>
          <div style="height:5px; background:#e2e8f0; width:100%; border-radius:4px; margin-top:6px;"></div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="ribbon-btn" onclick="applyAlignment('left')">◀ ชิดซ้าย</button>
          <button class="ribbon-btn" style="background:#e0f2fe; border-color:#38bdf8;" onclick="applyAlignment('center')">⬛ กึ่งกลาง</button>
          <button class="ribbon-btn" onclick="applyAlignment('right')">ชิดขวา ▶</button>
        </div>
      `;
    }
    else if (stage.mode === 'table_grid') {
      const grid = document.createElement('div');
      grid.className = 'table-picker';
      for (let r = 1; r <= 3; r++) {
        for (let c = 1; c <= 4; c++) {
          const cell = document.createElement('div');
          cell.className = 'table-cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.onclick = () => {
            highlightGrid(c, r);
            if (c === stage.targetCols && r === stage.targetRows) finishTaskSuccess(10);
            else finishTaskFail();
          };
          grid.appendChild(cell);
        }
      }
      stageBox.innerHTML = `<div style="font-size:0.85rem; color:#64748b; margin-bottom:2px;">แตะเลือกขนาด 3 x 2:</div>`;
      stageBox.appendChild(grid);
    }
    else {
      const defaultDiv = document.createElement('div');
      defaultDiv.style.display = 'flex';
      defaultDiv.style.gap = '8px';
      defaultDiv.style.flexWrap = 'wrap';
      defaultDiv.style.justifyContent = 'center';

      stage.opts = stage.opts || ["Square", "Behind Text", "In Front of Text"];
      stage.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'ribbon-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          if (opt.includes(stage.target)) finishTaskSuccess(10);
          else finishTaskFail();
        };
        defaultDiv.appendChild(btn);
      });
      stageBox.appendChild(defaultDiv);
    }
  }

  function triggerShortcutSuccess() {
    if (taskCompleted) return;
    const badge = document.getElementById('shortcut-badge');
    if (badge) {
      badge.style.background = '#dcfce7';
      badge.style.borderColor = '#22c55e';
      badge.style.color = '#15803d';
    }
    document.getElementById('shortcut-status').innerText = '🎉 ทำภารกิจสำเร็จ!';
    document.getElementById('shortcut-status').style.color = '#15803d';
    finishTaskSuccess(10);
  }

  function handleMinigameKeyboard(e) {
    const stage = stageData[currentStageIndex];
    if (stage.mode !== 'shortcut') return;

    const isCtrl = e.ctrlKey || e.metaKey;
    const isTargetCode = e.code === stage.codeReq;
    const isTargetKey = e.key.toLowerCase() === stage.keyReq;

    if (isCtrl && (isTargetCode || isTargetKey)) {
      e.preventDefault();
      triggerShortcutSuccess();
    }
  }

  function applyAlignment(type) {
    document.getElementById('sample-text').style.textAlign = type;
    if (type === 'center') {
      setTimeout(() => finishTaskSuccess(10), 250);
    } else {
      finishTaskFail();
    }
  }

  function highlightGrid(cols, rows) {
    document.querySelectorAll('.table-cell').forEach(cell => {
      const c = parseInt(cell.dataset.c);
      const r = parseInt(cell.dataset.r);
      if (c <= cols && r <= rows) cell.classList.add('selected');
      else cell.classList.remove('selected');
    });
  }

  function finishTaskSuccess(scoreGained) {
    if (taskCompleted) return;
    taskCompleted = true;

    totalScoreE1 += scoreGained;
    totalStars += 3;

    document.getElementById('ai-tip').innerHTML = `
      <strong style="color:#15803d">Word Co-Pilot:</strong> ยอดเยี่ยมมาก! ปฏิบัติภารกิจถูกต้อง 🎉 (+${scoreGained} แต้ม | 3 ⭐)
    `;

    updateHUD();
    document.getElementById('btn-drive').style.display = 'inline-block';
  }

  function finishTaskFail() {
    shields--;
    updateHUD();
    document.getElementById('ai-tip').innerHTML = `
      <strong style="color:#b91c1c">Word Co-Pilot:</strong> ยังไม่ถูกนะ เกราะลด 1 ดวง! คำใบ้: ${stageData[currentStageIndex].hint}
    `;
    if (shields <= 0) {
      showRepairModal();
    }
  }

  function continueDriving() {
    document.getElementById('terminal').style.display = 'none';
    currentStageIndex++;

    if (currentStageIndex < 12) {
      distanceToNextGate = 1000;
      isArrivedAtGate = false;
      obstacles = [];
      spawnObstacleWave(0.1);
      updateHUD();
    } else {
      alert(`🏆 ยินดีด้วย! คุณพิชิตครบทั้ง 4 Worlds 12 Checkpoints สำเร็จแล้ว!\nคะแนนรวม E1: ${totalScoreE1}/120 (${Math.round((totalScoreE1/120)*100)}%)\nพร้อมก้าวสู่เกม E2 (Word Jump) ต่อไป!`);
    }
  }

  window.onload = init;
</script>

</body>
</html>
