<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 Word Road 4D: True 3D Cockpit Quest (E1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- โหลด Three.js WebGL Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --cyan: #00f0ff;
      --gold: #ffd600;
      --red: #ff3366;
      --green: #00ff88;
      --dark: #0b0f19;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--dark);
      color: #fff;
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .main-frame {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* HUD Bar */
    .hud-bar {
      background: rgba(18, 26, 43, 0.9);
      border: 2px solid var(--cyan);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Chakra Petch', sans-serif;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    }
    .hud-val { color: var(--cyan); font-weight: bold; font-size: 1.15rem; }

    /* 3D Viewport Screen */
    .viewport-3d {
      position: relative;
      width: 100%;
      height: 560px;
      border-radius: 18px;
      overflow: hidden;
      border: 4px solid #1e293b;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      background: #000;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 4D Temporal Glitch Effect */
    .temporal-warp {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      background: radial-gradient(circle, transparent 40%, rgba(0, 240, 255, 0.3) 100%);
      mix-blend-mode: screen;
      filter: blur(1px);
      animation: warpPulse 0.15s infinite;
      z-index: 10;
    }
    @keyframes warpPulse {
      0% { transform: scale(1); filter: hue-rotate(0deg); }
      50% { transform: scale(1.02); filter: hue-rotate(180deg); }
      100% { transform: scale(1); filter: hue-rotate(360deg); }
    }

    /* Cockpit HUD Overlay */
    .cockpit-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 20;
    }

    /* แดชบอร์ดคนขับ */
    .dash-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.6) 0%, rgba(10, 15, 29, 0.98) 50%);
      border-top: 3px solid rgba(0, 240, 255, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 40px 14px 40px;
    }

    .meter-block { font-family: 'Chakra Petch'; text-align: center; }
    .meter-val { font-size: 2.2rem; font-weight: 700; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
    .meter-lbl { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }

    /* On-Screen Touch Controls */
    .controls-layer {
      position: absolute;
      bottom: 14px; left: 14px; right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 30;
    }
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid var(--cyan);
      color: #fff;
      font-family: 'Chakra Petch';
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .ctrl-btn:active { background: var(--cyan); color: #000; }

    /* Flash แดงตอนชน */
    .damage-flash {
      position: absolute;
      inset: 0;
      background: rgba(255, 51, 102, 0.45);
      display: none;
      pointer-events: none;
      z-index: 50;
    }

    /* Terminal เมื่อถึง Checkpoint */
    .stage-terminal {
      position: absolute;
      top: 40px; left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 780px;
      background: rgba(11, 17, 32, 0.96);
      backdrop-filter: blur(14px);
      border: 2px solid var(--cyan);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.35);
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 100;
      pointer-events: auto;
    }
    .term-title {
      font-family: 'Chakra Petch';
      font-size: 1.35rem;
      color: var(--cyan);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
    }
    .term-q { font-size: 1.15rem; line-height: 1.6; }

    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .opt-grid { grid-template-columns: 1fr; } }

    .opt-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      gap: 10px;
      transition: all 0.2s;
    }
    .opt-btn:hover:not(:disabled) { background: rgba(0, 240, 255, 0.2); border-color: var(--cyan); }
    .opt-btn.correct { background: rgba(0, 255, 136, 0.3) !important; border-color: var(--green) !important; color: var(--green) !important; }
    .opt-btn.wrong { background: rgba(255, 51, 102, 0.3) !important; border-color: var(--red) !important; color: var(--red) !important; }

    .ai-bubble {
      background: rgba(0, 120, 212, 0.15);
      border-left: 4px solid var(--cyan);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: #dbeafe;
    }

    .btn-next-gate {
      background: linear-gradient(135deg, #0078d4, var(--cyan));
      border: none;
      color: #000;
      font-family: 'Chakra Petch';
      font-weight: 700;
      font-size: 1rem;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      align-self: flex-end;
      display: none;
    }
  </style>
</head>
<body>

<div class="main-frame">

  <div class="hud-bar">
    <div>🛡️ พลังเกราะ: <span id="health-ui" class="hud-val">❤️❤️❤️</span></div>
    <div>🚩 โซนด่าน: <span id="stage-ui" class="hud-val">ด่าน 1 / 12 (Meadow)</span></div>
    <div>⭐ ดาวสะสม: <span id="star-ui" class="hud-val">0 ⭐</span></div>
    <div>📊 ประสิทธิภาพ E1: <span id="e1-ui" class="hud-val" style="color:var(--green)">0%</span></div>
  </div>

  <div class="viewport-3d" id="viewport">
    <div id="webgl-canvas"></div>
    <div class="temporal-warp" id="time-warp"></div>
    <div class="damage-flash" id="crash-flash"></div>

    <div class="cockpit-ui">
      <div class="dash-panel">
        <div class="meter-block">
          <div class="meter-val" id="speed-meter">0</div>
          <div class="meter-lbl">WARP SPEED (KM/H)</div>
        </div>
        <div class="meter-block">
          <div class="meter-val" id="dist-meter" style="color:var(--gold)">1000</div>
          <div class="meter-lbl">DISTANCE TO GATE (M)</div>
        </div>
      </div>

      <div class="controls-layer">
        <div style="display:flex; gap:8px;">
          <button class="ctrl-btn" id="btn-left">◀ โยกซ้าย (A)</button>
          <button class="ctrl-btn" id="btn-right">โยกขวา (D) ▶</button>
        </div>
        <button class="ctrl-btn" id="btn-gas" style="background:#0284c7; border-color:var(--cyan);">⚡ เร่งความเร็ว (W / ▲)</button>
      </div>
    </div>

    <!-- Terminal -->
    <div class="stage-terminal" id="terminal">
      <div class="term-title">
        <span id="term-name">🚧 CHECKPOINT 1: รู้จัก MICROSOFT WORD</span>
        <span id="term-badge" style="font-size:0.85rem; color:var(--gold);">🏅 Word Beginner</span>
      </div>
      <div class="term-q" id="term-q">...</div>
      <div class="opt-grid" id="term-opts"></div>
      <div class="ai-bubble" id="ai-msg"><strong>4D Assistant:</strong> พิกัดมิติเสถียรแล้ว! ตอบคำถามเพื่อเปิดเกตมิติต่อไป</div>
      <button id="btn-continue" class="btn-next-gate" onclick="continueVoyage()">ทะลุมิติต่อไป ➔</button>
    </div>

  </div>

</div>

<script>
  const stageData = [
    { id: 1, title: "Checkpoint 1: รู้จัก Microsoft Word", topic: "Ribbon & Interface", badge: "Word Beginner", q: "หากต้องการเรียกใช้คำสั่งพื้นฐาน เช่น การเปลี่ยนฟอนต์ จัดย่อหน้า ต้องเลือกดูที่แถบเมนู (Ribbon Tab) ใด?", opts: ["หน้าแรก (Home)", "แทรก (Insert)", "มุมมอง (View)", "รีวิว (Review)"], ans: 0, hint: "แถบปรับแต่งหลักจะรวมอยู่ที่แท็บแรกสุดเสมอ" },
    { id: 2, title: "Checkpoint 2: สร้างและบันทึกเอกสาร", topic: "Save & Save As", badge: "Save Master", q: "หากต้องการบันทึกทับเอกสารเดิมที่เคยตั้งชื่อไว้แล้วทันที ควรใช้คีย์ลัดใด?", opts: ["Ctrl + N", "Ctrl + S", "Ctrl + O", "Ctrl + P"], ans: 1, hint: "S ย่อมาจากคำว่า Save" },
    { id: 3, title: "Checkpoint 3: พิมพ์และแก้ไขข้อความ", topic: "Undo & Redo", badge: "Text Editor", q: "หากพิมพ์ผิดและต้องการ 'ยกเลิกคำสั่งล่าสุด' (Undo) ต้องกดคีย์ลัดใด?", opts: ["Ctrl + Y", "Ctrl + C", "Ctrl + Z", "Ctrl + V"], ans: 2, hint: "ปุ่มย้อนเวลาเอกสารคือปุ่ม Z" },
    { id: 4, title: "Checkpoint 4: จัดรูปแบบตัวอักษร", topic: "Font Styling", badge: "Format Master", q: "สัญลักษณ์ใดบนแถบ Ribbon ใช้สำหรับทำข้อความให้เป็น 'ตัวหนา' (Bold)?", opts: ["ไอคอนตัว I", "ไอคอนตัว U", "ไอคอนตัว B", "ไอคอนตัว X²"], ans: 2, hint: "Bold เริ่มต้นด้วยตัวอักษร B" },
    { id: 5, title: "Checkpoint 5: การจัดตำแหน่งย่อหน้า", topic: "Alignment", badge: "Paragraph Pro", q: "การจัดชื่อหัวข้อรายงานให้อยู่ 'กึ่งกลางหน้ากระดาษ' พอดี ต้องใช้คำสั่งใด?", opts: ["Align Left", "Center (Ctrl + E)", "Align Right", "Justify"], ans: 1, hint: "Center หมายถึงกึ่งกลาง มีคีย์ลัดคือ Ctrl + E" },
    { id: 6, title: "Checkpoint 6: สัญลักษณ์และลำดับเลข", topic: "Bullets & Numbering", badge: "List Architect", q: "รายการขั้นตอนทดลองที่ 'ต้องทำตามลำดับก่อนหลัง' ควรใช้เครื่องมือใด?", opts: ["Bullets (จุดกลม)", "Numbering (ลำดับเลข 1, 2, 3)", "Multilevel List", "Line Spacing"], ans: 1, hint: "ขั้นตอนตายตัวต้องอาศัยลำดับหมายเลข" },
    { id: 7, title: "Checkpoint 7: การแทรกรูปภาพ", topic: "Insert Picture & Wrap Text", badge: "Media Specialist", q: "เมื่อแทรกรูปภาพแล้วขยับตำแหน่งไม่ได้อย่างอิสระ ต้องไปตั้งค่าเครื่องมือใด?", opts: ["Picture Border", "Crop", "Wrap Text (การตัดข้อความ)", "Corrections"], ans: 2, hint: "Wrap Text เช่น Square จะช่วยให้รูปขยับอิสระรอบข้อความ" },
    { id: 8, title: "Checkpoint 8: การจัดการตาราง", topic: "Tables & Merging", badge: "Table Builder", q: "หากต้องการรวมช่องตาราง 2 ช่องเข้าด้วยกันเป็นช่องเดียว ต้องใช้คำสั่งใด?", opts: ["Split Cells", "Merge Cells", "Insert Row", "Delete Column"], ans: 1, hint: "Merge หมายถึงการผสานรวมกัน" },
    { id: 9, title: "Checkpoint 9: ตั้งค่าหน้ากระดาษ", topic: "Margins & Orientation", badge: "Layout Pilot", q: "หากต้องการเปลี่ยนกระดาษจากแนวตั้งให้เป็น 'แนวนอน' ต้องเลือกคำสั่งใด?", opts: ["Margins (ระยะขอบ)", "Orientation (การวางแนว)", "Size (ขนาด)", "Columns (คอลัมน์)"], ans: 1, hint: "Orientation มีให้เลือกระหว่าง Portrait และ Landscape" },
    { id: 10, title: "Checkpoint 10: การตรวจสอบเอกสาร", topic: "Proofing & Spell Check", badge: "Doc Inspector", q: "เส้นหยักสีแดงใต้ข้อความในเอกสาร Word บ่งบอกถึงสิ่งใด?", opts: ["สะกดคำที่อาจผิดพลาด", "ไวยากรณ์ผิดพลาด", "ข้อความเกินขอบ", "คำที่ถูกล็อค"], ans: 0, hint: "เส้นหยักแดง = สะกดคำ, เส้นหยักฟ้า = ไวยากรณ์" },
    { id: 11, title: "Checkpoint 11: การใช้สไตล์อัตโนมัติ", topic: "Heading Styles", badge: "Style Maestro", q: "การกำหนด 'Heading Styles' ให้หัวข้อ มีประโยชน์สูงสุดด้านใด?", opts: ["ลดขนาดไฟล์", "สร้างสารบัญอัตโนมัติได้ทันที", "ป้องกันการก็อปปี้", "แปลงภาษา"], ans: 1, hint: "Heading คือหัวใจของการดึงสารบัญ (Table of Contents)" },
    { id: 12, title: "Checkpoint 12: การส่งออกเอกสารสมบูรณ์", topic: "Export PDF & Finish", badge: "Word Grand Master", q: "หากต้องการส่งงานไปพิมพ์โดยไม่ให้ฟอนต์เพี้ยนหรือหน้าเคลื่อน ควรส่งออกเป็นไฟล์ใด?", opts: [".txt", ".docx", ".pdf", ".html"], ans: 2, hint: "PDF ล็อคโครงสร้างหน้ากระดาษได้คงที่ที่สุด" }
  ];

  let curStage = 0;
  let shields = 3;
  let scoreE1 = 0;
  let stars = 0;
  let stageTries = 0;

  // 3-Lane Setup ในพิกัดแกน X ของ Three.js
  const laneX = [-3.8, 0, 3.8];
  let curLane = 1;
  let targetCamX = 0;
  let carSpeed = 0;
  let distanceGate = 1000;
  let isArrived = false;
  let isGas = false;

  // Three.js Core Variables
  let scene, camera, renderer;
  let roadMesh, stripesGroup;
  let treePool = [];
  let obstaclePool = [];
  let checkpointGate;

  function initThree() {
    const container = document.getElementById('webgl-canvas');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1424, 0.015);

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 400);
    camera.position.set(0, 2.2, 0); // ตำแหน่งสายตาคนขับ Cockpit

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // แสงในฉาก 3D
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 30, 20);
    scene.add(dirLight);

    buildWorld();
    bindEvents();
    updateHUD();
    animate();
  }

  function buildWorld() {
    // 1. พื้นดิน/ทุ่งหญ้า 3D
    const groundGeo = new THREE.PlaneGeometry(300, 500);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x16a34a });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    scene.add(ground);

    // 2. ถนนแอสฟัลต์ 3 เลน (กว้าง 12 เมตร)
    const roadGeo = new THREE.PlaneGeometry(12, 500);
    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222a38 });
    roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.rotation.x = -Math.PI / 2;
    scene.add(roadMesh);

    // ขอบทางแดง-ขาว
    const curbGeo = new THREE.PlaneGeometry(0.6, 500);
    const curbMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
    const leftCurb = new THREE.Mesh(curbGeo, curbMat);
    leftCurb.rotation.x = -Math.PI / 2;
    leftCurb.position.set(-6.3, 0.01, 0);
    scene.add(leftCurb);

    const rightCurb = leftCurb.clone();
    rightCurb.position.set(6.3, 0.01, 0);
    scene.add(rightCurb);

    // 3. เส้นประแบ่ง 3 เลน
    stripesGroup = new THREE.Group();
    const stripeGeo = new THREE.PlaneGeometry(0.2, 4);
    const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let z = 0; z > -250; z -= 8) {
      const leftStripe = new THREE.Mesh(stripeGeo, stripeMat);
      leftStripe.rotation.x = -Math.PI / 2;
      leftStripe.position.set(-2, 0.02, z);
      stripesGroup.add(leftStripe);

      const rightStripe = new THREE.Mesh(stripeGeo, stripeMat);
      rightStripe.rotation.x = -Math.PI / 2;
      rightStripe.position.set(2, 0.02, z);
      stripesGroup.add(rightStripe);
    }
    scene.add(stripesGroup);

    // 4. ต้นไม้ 3D ขนาดใหญ่ขนาบข้างทาง
    for (let i = 0; i < 20; i++) {
      const tree = create3DTree();
      tree.position.set(i % 2 === 0 ? -10 - Math.random() * 4 : 10 + Math.random() * 4, 0, -i * 15);
      scene.add(tree);
      treePool.push(tree);
    }

    // 5. ซุ้มประตู Checkpoint 3D
    checkpointGate = create3DGate();
    checkpointGate.position.set(0, 0, -350);
    scene.add(checkpointGate);

    // 6. สุ่มสร้างสิ่งกีดขวาง 3D ชุดแรก
    spawn3DObstacleWave(-60);
    spawn3DObstacleWave(-120);
  }

  function create3DTree() {
    const group = new THREE.Group();
    // ลำต้น
    const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 5, 8);
    const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 2.5;
    group.add(trunk);

    // พุ่มใบไม้ 3 ชั้น
    const leafMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
    for (let l = 0; l < 3; l++) {
      const leafGeo = new THREE.ConeGeometry(3.5 - l * 0.7, 4, 8);
      const leaves = new THREE.Mesh(leafGeo, leafMat);
      leaves.position.y = 4.5 + l * 2.2;
      group.add(leaves);
    }
    return group;
  }

  function create3DGate() {
    const group = new THREE.Group();
    const pillarMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
    const p1 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 1), pillarMat);
    p1.position.set(-6, 5, 0);
    const p2 = p1.clone();
    p2.position.set(6, 5, 0);

    const beam = new THREE.Mesh(new THREE.BoxGeometry(14, 2, 1.2), new THREE.MeshLambertMaterial({ color: 0x0369a1 }));
    beam.position.set(0, 9, 0);

    group.add(p1); group.add(p2); group.add(beam);
    return group;
  }

  function spawn3DObstacleWave(zPos) {
    const safeLane = Math.floor(Math.random() * 3);
    const blockedLanes = [0, 1, 2].filter(l => l !== safeLane);
    const count = Math.random() < 0.5 ? 1 : 2;

    blockedLanes.slice(0, count).forEach(laneIdx => {
      const obs = create3DObstacle();
      obs.position.set(laneX[laneIdx], 0, zPos);
      obs.lane = laneIdx;
      obs.hit = false;
      scene.add(obs);
      obstaclePool.push(obs);
    });
  }

  function create3DObstacle() {
    const group = new THREE.Group();
    // กรวยจราจรเรืองแสง 3D ขนาดเต็มเลน
    const coneGeo = new THREE.ConeGeometry(1.4, 2.8, 12);
    const coneMat = new THREE.MeshLambertMaterial({ color: 0xea580c });
    const cone = new THREE.Mesh(coneGeo, coneMat);
    cone.position.y = 1.4;

    const baseGeo = new THREE.BoxGeometry(2.4, 0.3, 2.4);
    const baseMat = new THREE.MeshLambertMaterial({ color: 0x222a38 });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = 0.15;

    group.add(base);
    group.add(cone);
    return group;
  }

  function switchLane(dir) {
    if (isArrived) return;
    if (dir === -1 && curLane > 0) curLane--;
    else if (dir === 1 && curLane < 2) curLane++;
    targetCamX = laneX[curLane];
  }

  function bindEvents() {
    window.addEventListener('keydown', (e) => {
      if (isArrived) return;
      const k = e.key.toLowerCase();
      if (k === 'w' || e.code === 'ArrowUp') isGas = true;
      if (k === 'a' || e.code === 'ArrowLeft') switchLane(-1);
      if (k === 'd' || e.code === 'ArrowRight') switchLane(1);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.code === 'ArrowUp') isGas = false;
    });

    document.getElementById('btn-left').onclick = () => switchLane(-1);
    document.getElementById('btn-right').onclick = () => switchLane(1);

    const gasBtn = document.getElementById('btn-gas');
    gasBtn.onmousedown = () => isGas = true;
    gasBtn.onmouseup = () => isGas = false;
    gasBtn.ontouchstart = (e) => { e.preventDefault(); isGas = true; };
    gasBtn.ontouchend = (e) => { e.preventDefault(); isGas = false; };
  }

  function updateHUD() {
    let hearts = "";
    for(let i=0; i<3; i++) hearts += (i < shields) ? "❤️" : "🖤";
    document.getElementById('health-ui').innerText = hearts;

    const biomeNames = ["Meadow", "Sunset Canyon", "Cyber Route"];
    const biome = biomeNames[Math.floor(curStage / 4)];
    document.getElementById('stage-ui').innerText = `ด่าน ${curStage + 1} / 12 (${biome})`;
    document.getElementById('star-ui').innerText = `${stars} ⭐`;

    const pct = Math.round((scoreE1 / 120) * 100);
    document.getElementById('e1-ui').innerText = `${scoreE1}/120 (${pct}%)`;
  }

  function triggerCrash() {
    carSpeed = Math.max(10, carSpeed * 0.2);
    shields--;
    updateHUD();

    const flash = document.getElementById('crash-flash');
    flash.style.display = 'block';
    setTimeout(() => { flash.style.display = 'none'; }, 250);
  }

  // 4D Time-Warp Effect (ปรากฏการณ์บิดเบี้ยวมิติกาลเวลา)
  function toggleTimeWarp(enable) {
    document.getElementById('time-warp').style.display = enable ? 'block' : 'none';
  }

  function animate() {
    requestAnimationFrame(animate);

    if (!isArrived) {
      // 1. ระบบฟิสิกส์การเร่งความเร็ว
      if (isGas) carSpeed = Math.min(carSpeed + 1.2, 140);
      else carSpeed = Math.max(carSpeed - 0.8, 0);

      // 2. การสไลด์เข้าเลน (Smooth Camera Translation)
      camera.position.x += (targetCamX - camera.position.x) * 0.12;

      // 3. เลื่อนวัตถุ 3D ผ่านตัวรถ (Forward Motion)
      const forwardDelta = carSpeed * 0.012;

      // เลื่อนเส้นประถนน
      stripesGroup.children.forEach(s => {
        s.position.z += forwardDelta;
        if (s.position.z > 5) s.position.z -= 250;
      });

      // เลื่อนต้นไม้
      treePool.forEach(t => {
        t.position.z += forwardDelta;
        if (t.position.z > 10) t.position.z -= 280;
      });

      // เลื่อนและตรวจสอบการชนสิ่งกีดขวาง
      for (let i = obstaclePool.length - 1; i >= 0; i--) {
        const obs = obstaclePool[i];
        obs.position.z += forwardDelta;

        // ตรวจจับชนในระยะพิกัด Z = -2.5 ถึง 0
        if (!obs.hit && obs.position.z > -3.0 && obs.position.z < 0) {
          if (curLane === obs.lane && carSpeed > 5) {
            obs.hit = true;
            triggerCrash();
          }
        }

        // ลบสิ่งกีดขวางที่เลยหลังรถไปแล้ว
        if (obs.position.z > 8) {
          scene.remove(obs);
          obstaclePool.splice(i, 1);
        }
      }

      // สุ่มเกิดระลอกใหม่ที่ระยะ Z = -180
      if (obstaclePool.length < 4 && distanceGate > 300 && Math.random() < 0.02) {
        spawn3DObstacleWave(-180);
      }

      // 4. ซุ้มประตู Checkpoint เลื่อนเข้ามา
      distanceGate -= (carSpeed * 0.035);
      if (distanceGate < 400) {
        checkpointGate.position.z = -(distanceGate * 0.8);
      }

      if (distanceGate <= 0) {
        distanceGate = 0;
        carSpeed = 0;
        isArrived = true;
        reachCheckpoint();
      }

      document.getElementById('speed-meter').innerText = Math.round(carSpeed);
      document.getElementById('dist-meter').innerText = Math.round(distanceGate);
    }

    renderer.render(scene, camera);
  }

  function reachCheckpoint() {
    toggleTimeWarp(true); // เปิด 4D Time-Shift Effect
    const st = stageData[curStage];
    stageTries = 0;

    const term = document.getElementById('terminal');
    term.style.display = 'flex';

    document.getElementById('term-name').innerText = `🚧 ${st.title.toUpperCase()}`;
    document.getElementById('term-badge').innerText = `🏅 ${st.badge}`;
    document.getElementById('term-q').innerText = st.q;

    const optBox = document.getElementById('term-opts');
    optBox.innerHTML = '';
    st.opts.forEach((txt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span><strong>${String.fromCharCode(65 + i)}.</strong></span> <span>${txt}</span>`;
      btn.onclick = () => answerStage(i);
      optBox.appendChild(btn);
    });

    document.getElementById('btn-continue').style.display = 'none';
  }

  function answerStage(idx) {
    const st = stageData[curStage];
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if (idx === st.ans) {
      btns[idx].classList.add('correct');

      let addScore = 10, addStars = 3;
      if (stageTries === 1) { addScore = 7; addStars = 2; }
      else if (stageTries >= 2) { addScore = 5; addStars = 1; }

      scoreE1 += addScore;
      stars += addStars;

      document.getElementById('ai-msg').innerHTML = `
        <strong style="color:var(--green)">4D Assistant:</strong> พิกัดถูกต้อง! ปลดล็อกมิติเวลาสำเร็จ (+${addScore} คะแนน E1 | ${addStars} ⭐)
      `;

      updateHUD();
      document.getElementById('btn-continue').style.display = 'inline-block';

    } else {
      btns[idx].classList.add('wrong');
      stageTries++;
      shields--;
      updateHUD();

      document.getElementById('ai-msg').innerHTML = `
        <strong style="color:var(--red)">4D Assistant:</strong> มิติเวลาคลาดเคลื่อน! คำใบ้: ${st.hint}
      `;

      setTimeout(() => {
        btns.forEach(b => { b.disabled = false; b.classList.remove('wrong'); });
      }, 1200);
    }
  }

  function continueVoyage() {
    toggleTimeWarp(false);
    document.getElementById('terminal').style.display = 'none';
    curStage++;

    if (curStage < 12) {
      distanceGate = 1000;
      isArrived = false;
      checkpointGate.position.z = -350;

      // ล้างสิ่งกีดขวางรอบเก่า
      obstaclePool.forEach(obs => scene.remove(obs));
      obstaclePool = [];
      spawn3DObstacleWave(-80);

      // เปลี่ยนธีมสีท้องฟ้าและหมอกตามกลุ่มด่าน (Biomes)
      if (curStage >= 8) {
        scene.fog.color.setHex(0x180b2b); // Cyber Neon Fog
      } else if (curStage >= 4) {
        scene.fog.color.setHex(0xb45309); // Sunset Canyon Fog
      }

      updateHUD();
    } else {
      alert(`🏆 ยินดีด้วย! คุณพิชิตครบทั้ง 12 มิติด่านสำเร็จแล้ว!\nคะแนนรวม E1: ${scoreE1}/120 (${Math.round((scoreE1/120)*100)}%)\nพร้อมทะลุมิติสู่เกม E2 (Word Jump) ต่อไป!`);
    }
  }

  window.onload = initThree;
</script>
